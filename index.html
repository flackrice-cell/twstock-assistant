<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0f14">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="台股助手">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<title>台股決策助手</title>
<style>
:root{
  --bg:#0b0f14; --card:#131a23; --card2:#1a2432; --bd:#22303d; --fg:#e6edf3; --mut:#8b9bab;
  --up:#ff5d5d; --dn:#2fd39a; --ac:#4da3ff; --warn:#ffb545; --ok:#2fd39a;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--bg);color:var(--fg);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC","Microsoft JhengHei",sans-serif;
  -webkit-text-size-adjust:100%}
body{font-size:15px;line-height:1.5;padding-bottom:calc(70px + env(safe-area-inset-bottom))}
h1,h2,h3,h4{margin:0;font-weight:700}
button,input,select,textarea{font-family:inherit;font-size:16px}
.up{color:var(--up)} .dn{color:var(--dn)} .mut{color:var(--mut)}
.mono{font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}

/* header */
#hdr{position:sticky;top:0;z-index:30;background:rgba(11,15,20,.94);backdrop-filter:blur(10px);
  border-bottom:1px solid var(--bd);padding:calc(10px + env(safe-area-inset-top)) 14px 8px}
.hdr-top{display:flex;align-items:center;gap:10px}
.hdr-top h1{font-size:17px;letter-spacing:.5px}
.hdr-top .sp{flex:1}
.iconbtn{min-width:44px;min-height:44px;display:flex;align-items:center;justify-content:center;
  background:var(--card);border:1px solid var(--bd);border-radius:12px;color:var(--fg);cursor:pointer}
.hdr-sub{display:flex;align-items:center;gap:8px;margin-top:6px;font-size:12.5px;color:var(--mut);flex-wrap:wrap}
.chip{padding:2px 8px;border-radius:999px;border:1px solid var(--bd);background:var(--card);white-space:nowrap}
.chip.bull{color:var(--up);border-color:rgba(255,93,93,.4)}
.chip.bear{color:var(--dn);border-color:rgba(47,211,154,.4)}
.chip.warn{color:var(--warn);border-color:rgba(255,181,69,.4)}

/* layout */
main{padding:12px 12px 24px;max-width:760px;margin:0 auto}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:12px;margin-bottom:10px}
.card.pad0{padding:0;overflow:hidden}
.row{display:flex;align-items:center;gap:8px}
.row.wrap{flex-wrap:wrap}
.sp{flex:1}
.sec-title{font-size:13px;color:var(--mut);margin:16px 4px 8px;letter-spacing:.5px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.kv{background:var(--card2);border-radius:10px;padding:8px 10px}
.kv .k{font-size:11.5px;color:var(--mut)}
.kv .v{font-size:15px;font-weight:600;margin-top:2px}

/* list items */
.item{display:flex;gap:10px;align-items:center;padding:10px 12px;border-bottom:1px solid var(--bd)}
.item:last-child{border-bottom:0}
.item .l{flex:1;min-width:0}
.item .nm{font-weight:600;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .cd{font-size:11.5px;color:var(--mut)}
.item .r{text-align:right;white-space:nowrap}
.item .px{font-weight:700}
.pill{display:inline-block;font-size:11px;padding:1px 7px;border-radius:999px;border:1px solid var(--bd);color:var(--mut);margin-right:4px}
.pill.buy{color:var(--up);border-color:rgba(255,93,93,.45);background:rgba(255,93,93,.08)}
.pill.hold{color:var(--ac);border-color:rgba(77,163,255,.4);background:rgba(77,163,255,.08)}
.pill.cut{color:var(--dn);border-color:rgba(47,211,154,.45);background:rgba(47,211,154,.08)}
.pill.warnp{color:var(--warn);border-color:rgba(255,181,69,.45);background:rgba(255,181,69,.08)}

/* buttons */
.btn{min-height:48px;padding:0 16px;border-radius:12px;border:1px solid var(--bd);background:var(--card2);
  color:var(--fg);font-weight:600;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn.primary{background:var(--ac);border-color:var(--ac);color:#06121f}
.btn.danger{background:transparent;border-color:rgba(255,93,93,.5);color:var(--up)}
.btn.sm{min-height:38px;font-size:13.5px;padding:0 12px;border-radius:10px}
.btn.block{width:100%}
.btn:disabled{opacity:.5}
input[type=text],input[type=number],select{width:100%;min-height:46px;background:var(--card2);color:var(--fg);
  border:1px solid var(--bd);border-radius:10px;padding:0 12px}
label.f{display:block;margin-bottom:10px}
label.f .lb{font-size:12.5px;color:var(--mut);margin-bottom:4px;display:block}

/* tabs */
#tabs{position:fixed;left:0;right:0;bottom:0;z-index:40;display:flex;background:rgba(11,15,20,.96);
  backdrop-filter:blur(10px);border-top:1px solid var(--bd);padding-bottom:env(safe-area-inset-bottom)}
#tabs button{flex:1;min-height:58px;background:none;border:0;color:var(--mut);font-size:11.5px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;cursor:pointer}
#tabs button.on{color:var(--ac)}
#tabs .ic{font-size:19px;line-height:1}

/* misc */
.spark{display:block;width:100%;height:34px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(80px + env(safe-area-inset-bottom));
  background:#22303d;color:#fff;padding:10px 16px;border-radius:999px;font-size:13.5px;z-index:60;
  opacity:0;transition:opacity .25s;pointer-events:none;max-width:88%}
.toast.on{opacity:1}
.modal{position:fixed;inset:0;z-index:70;background:rgba(0,0,0,.6);display:flex;align-items:flex-end}
.modal .sheet{background:var(--card);width:100%;max-height:88vh;overflow:auto;border-radius:16px 16px 0 0;
  padding:16px 16px calc(20px + env(safe-area-inset-bottom))}
@media(min-width:640px){.modal{align-items:center}.modal .sheet{max-width:520px;margin:0 auto;border-radius:16px}}
.bar{height:6px;border-radius:999px;background:var(--card2);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--ac)}
table.t{width:100%;border-collapse:collapse;font-size:13px}
table.t th,table.t td{padding:7px 6px;text-align:right;border-bottom:1px solid var(--bd);white-space:nowrap}
table.t th:first-child,table.t td:first-child{text-align:left}
table.t th{color:var(--mut);font-weight:500;font-size:11.5px}
.note{font-size:12px;color:var(--mut);line-height:1.6}
.hint{background:rgba(77,163,255,.08);border:1px solid rgba(77,163,255,.25);border-radius:10px;padding:9px 11px;font-size:12.5px;color:#bcd7ff}
.hint.warn{background:rgba(255,181,69,.08);border-color:rgba(255,181,69,.28);color:#ffdca8}
.hint.bad{background:rgba(255,93,93,.08);border-color:rgba(255,93,93,.3);color:#ffc0c0}
.empty{text-align:center;color:var(--mut);padding:28px 12px;font-size:13.5px}
.loading{display:flex;align-items:center;gap:10px;color:var(--mut);font-size:13px;padding:10px 2px}
.spin{width:16px;height:16px;border:2px solid var(--bd);border-top-color:var(--ac);border-radius:50%;
  animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.det-h{display:flex;align-items:flex-end;gap:10px}
.det-h .p{font-size:30px;font-weight:800;line-height:1}
details.dt{border:1px solid var(--bd);border-radius:12px;padding:10px 12px;background:var(--card2);margin-bottom:8px}
details.dt>summary{cursor:pointer;font-size:13.5px;font-weight:600;list-style:none}
details.dt>summary::-webkit-details-marker{display:none}
details.dt>summary::after{content:"＋";float:right;color:var(--mut)}
details.dt[open]>summary::after{content:"－"}
svg .ln{fill:none;stroke-width:1.6;vector-effect:non-scaling-stroke}
@media(max-width:520px){table.t.toCards thead{display:none}
  table.t.toCards tr{display:block;border:1px solid var(--bd);border-radius:10px;margin-bottom:8px;padding:6px 8px}
  table.t.toCards td{display:flex;justify-content:space-between;border:0;padding:4px 0;text-align:right}
  table.t.toCards td::before{content:attr(data-label);color:var(--mut);font-size:12px;text-align:left;flex:1;margin-right:10px}}
</style>
</head>
<body>
<header id="hdr">
  <div class="hdr-top">
    <h1>台股決策助手</h1>
    <span class="sp"></span>
    <button class="iconbtn" id="btnRefresh" title="更新資料">⟳</button>
  </div>
  <div class="hdr-sub" id="hdrSub"><span class="chip">載入中…</span></div>
</header>
<main id="view"></main>
<nav id="tabs">
  <button data-tab="home" class="on"><span class="ic">◎</span>總覽</button>
  <button data-tab="hold"><span class="ic">▤</span>持股追蹤</button>
  <button data-tab="pick"><span class="ic">✦</span>選股</button>
  <button data-tab="cfg"><span class="ic">⚙</span>設定</button>
</nav>
<div class="toast" id="toast"></div>
<div id="modalRoot"></div>
<script>
/* ============================================================
 * 01-core.js — 狀態、儲存、工具函式
 * ============================================================ */
'use strict';
(function () {

var LS_STATE = 'twstock.state.v1';
var LS_DATA  = 'twstock.data.v1';
var storageOK = true;

function lsGet(key, def) {
  try {
    var s = localStorage.getItem(key);
    if (!s) { localStorage.setItem(key + '.probe', '1'); return def; }
    return JSON.parse(s);
  } catch (e) { storageOK = false; return def; }
}
function lsSet(key, val) {
  try { localStorage.setItem(key, JSON.stringify(val)); return true; }
  catch (e) { storageOK = false; return false; }
}

/* ---------- 預設狀態 ---------- */
var DEFAULT_CFG = {
  capital: 1000000,     // 可投入資金（元）
  riskPct: 1,           // 單筆最大風險（% of 資金）
  stopMode: 'atr',      // atr | ma | pct
  atrK: 2,              // 停損 = 進場 - atrK × ATR
  maxStopPct: 10,       // 停損最大容忍幅度 %
  minLot: 1,            // 最小下單單位（股）：1=零股, 1000=整股
  scanMinLots: 2000,    // 選股：最小成交量（張）
  scanMinValue: 50,     // 選股：法人單日買超金額門檻（百萬元）
  scanPool: 30,         // 選股：進入技術面評分的檔數
  showN: 15,            // 選股：顯示前 N 名
  notify: false
};

function loadState() {
  var s = lsGet(LS_STATE, null) || {};
  var cfg = Object.assign({}, DEFAULT_CFG, s.cfg || {});
  return {
    tab: s.tab || 'home',
    cfg: cfg,
    holdings: Array.isArray(s.holdings) ? s.holdings : [],
    watch: Array.isArray(s.watch) ? s.watch : [],
    scan: s.scan || null,
    lastOpen: s.lastOpen || null
  };
}
var S = loadState();
function saveState() {
  lsSet(LS_STATE, { tab: S.tab, cfg: S.cfg, holdings: S.holdings, watch: S.watch, scan: S.scan, lastOpen: S.lastOpen });
}
function saveData() {
  try {
    if (JSON.stringify(DCACHE).length > 3500000) {      // 保護 localStorage 上限
      DCACHE.hist = {};                                  // 丟掉最肥的部分，保留快照
    }
    lsSet(LS_DATA, DCACHE);
  } catch (e) { /* 忽略：資料快取失效不影響功能 */ }
}
var DCACHE = lsGet(LS_DATA, { market: null, snapshot: null, chips: null, hist: {}, day: null, at: 0 }) || {};
if (!DCACHE.hist) DCACHE.hist = {};

/* ---------- 小工具 ---------- */
function esc(s) {
  return String(s === undefined || s === null ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}
function num(s) {
  if (s === null || s === undefined) return NaN;
  var t = String(s).replace(/,/g, '').replace(/<[^>]*>/g, '').replace(/\s/g, '').replace(/\+/g, '');
  if (t === '' || t === '-') return NaN;
  return parseFloat(t);
}
function signStr(s) { return /<p[^>]*>\s*-|^-/.test(String(s)) ? '-' : ''; }

function fmt(n, d) {
  d = d === undefined ? 2 : d;
  if (!isFinite(n)) return '—';
  return n.toLocaleString('zh-TW', { minimumFractionDigits: d, maximumFractionDigits: d });
}
function fmtPx(n) { return isFinite(n) ? fmt(n, n < 100 ? 2 : 2) : '—'; }
function fmtPct(n, d) { d = d === undefined ? 2 : d; return isFinite(n) ? (n > 0 ? '+' : '') + fmt(n, d) + '%' : '—'; }
function fmtMoney(n) {
  if (!isFinite(n)) return '—';
  var a = Math.abs(n);
  if (a >= 1e8) return fmt(n / 1e8, 2) + '億';
  if (a >= 1e4) return fmt(n / 1e4, 1) + '萬';
  return fmt(n, 0);
}
function fmtLots(shares) { return fmt(shares / 1000, 0) + '張'; }
function cls(n) { return n > 0 ? 'up' : (n < 0 ? 'dn' : 'mut'); }
function todayISO(offsetDays) {
  var d = new Date(Date.now() + (offsetDays || 0) * 86400000);
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
}
function isoToROC(iso) {  // 2026-09-24 -> 20260924
  return iso.replace(/-/g, '');
}
function rocToISO(s) {   // 115/09/24 -> 2026-09-24
  var m = /^(\d{2,3})\/(\d{2})\/(\d{2})$/.exec(String(s).trim());
  if (!m) return null;
  return (parseInt(m[1], 10) + 1911) + '-' + m[2] + '-' + m[3];
}
function isWeekend(d) { var w = d.getDay(); return w === 0 || w === 6; }
function toast(msg, ms) {
  var el = document.getElementById('toast');
  el.textContent = msg; el.classList.add('on');
  clearTimeout(el._t); el._t = setTimeout(function () { el.classList.remove('on'); }, ms || 1900);
}
function sum(a) { var t = 0; for (var i = 0; i < a.length; i++) t += a[i]; return t; }

/* ---------- 網路 ---------- */
function getJSON(url, timeoutMs) {
  return new Promise(function (resolve, reject) {
    var ctl = ('AbortController' in window) ? new AbortController() : null;
    var timer = setTimeout(function () { if (ctl) ctl.abort(); }, timeoutMs || 25000);
    fetch(url, { cache: 'no-store', signal: ctl ? ctl.signal : undefined })
      .then(function (r) {
        if (!r.ok) throw new Error('HTTP ' + r.status);
        return r.json();
      })
      .then(function (j) { clearTimeout(timer); resolve(j); })
      .catch(function (e) { clearTimeout(timer); reject(e); });
  });
}
/* 同時最多 n 條連線 */
function pool(items, n, fn, onProgress) {
  var i = 0, done = 0, out = new Array(items.length), total = items.length;
  return new Promise(function (resolve) {
    if (!total) return resolve(out);
    var active = 0;
    function next() {
      if (i >= total) return;
      var idx = i++;
      active++;
      Promise.resolve()
        .then(function () { return fn(items[idx], idx); })
        .then(function (r) { out[idx] = r; })
        .catch(function (e) { out[idx] = { __err: String(e && e.message || e) }; })
        .then(function () {
          active--; done++;
          if (onProgress) onProgress(done, total);
          if (done >= total) resolve(out); else next();
        });
    }
    for (var k = 0; k < Math.min(n, total); k++) next();
  });
}

window.T = {
  S: S, DCACHE: DCACHE, saveState: saveState, saveData: saveData,
  esc: esc, num: num, signStr: signStr, fmt: fmt, fmtPx: fmtPx, fmtPct: fmtPct,
  fmtMoney: fmtMoney, fmtLots: fmtLots, cls: cls, todayISO: todayISO,
  isoToROC: isoToROC, rocToISO: rocToISO, isWeekend: isWeekend, toast: toast,
  sum: sum, getJSON: getJSON, pool: pool, defaultCfg: DEFAULT_CFG,
  storageOK: function () { return storageOK; }
};
})();

/* ============================================================
 * 02-data.js — 證交所 / FinMind 資料抓取與快取
 * ============================================================ */
'use strict';
(function () {
var T = window.T;
var getJSON = T.getJSON, pool = T.pool, DCACHE = T.DCACHE;
var TWSE = 'https://www.twse.com.tw/rwd/zh/';
var FINMIND = 'https://api.finmindtrade.com/api/v4/data';

/* ---------------- 交易日 ----------------
 * 往回找最近一個「有資料」的交易日（自動跨過週末與國定假日）。 */
function probeTradingDay() {
  var d = new Date();
  var tries = 0;
  return new Promise(function (resolve, reject) {
    (function step() {
      if (tries++ > 12) return reject(new Error('找不到最近的交易日資料'));
      var iso = d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
      var wd = d.getDay();
      if (wd === 0 || wd === 6) { d.setDate(d.getDate() - 1); return step(); }
      getJSON(TWSE + 'afterTrading/MI_INDEX?date=' + T.isoToROC(iso) + '&type=ALLBUT0999&response=json', 20000)
        .then(function (j) {
          if (j && j.stat === 'OK' && findQuoteTable(j)) return resolve(iso);
          d.setDate(d.getDate() - 1); step();
        })
        .catch(function () { d.setDate(d.getDate() - 1); step(); });
    })();
  });
}
function findQuoteTable(j) {
  var t = j && j.tables;
  if (!t) return null;
  for (var i = 0; i < t.length; i++) {
    var f = t[i] && t[i].fields;
    if (f && f.indexOf('證券代號') >= 0 && f.indexOf('收盤價') >= 0 && t[i].data && t[i].data.length) {
      // 跳過權證等非股票表：以第一列代號是否 4 碼數字判斷
      if (/^\d{4}/.test(String(t[i].data[0][0]))) return t[i];
    }
  }
  return null;
}

/* ---------------- 全市場當日行情（上市，一次抓全部） ---------------- */
function fetchSnapshot(iso) {
  return getJSON(TWSE + 'afterTrading/MI_INDEX?date=' + T.isoToROC(iso) + '&type=ALLBUT0999&response=json', 30000)
    .then(function (j) {
      var qt = findQuoteTable(j);
      if (!qt) throw new Error('無行情表');
      var idx = { name: '發行量加權股價指數', close: NaN, change: NaN, pct: NaN };
      var t0 = (j.tables || [])[0];
      if (t0) {
        for (var r = 0; r < t0.data.length; r++) {
          if (String(t0.data[r][0]).indexOf('發行量加權股價指數') >= 0) {
            idx.close = T.num(t0.data[r][1]);
            idx.change = (T.signStr(t0.data[r][2]) === '-' ? -1 : 1) * T.num(t0.data[r][3]);
            idx.pct = T.num(t0.data[r][4]);
            break;
          }
        }
      }
      var breadth = { up: 0, down: 0, flat: 0 };
      for (var k = 0; k < (j.tables || []).length; k++) {
        if ((j.tables[k].fields || []).indexOf('類型') >= 0) {
          (j.tables[k].data || []).forEach(function (row) {
            var label = String(row[0]);
            var stock = String(row[2] || '');
            var m = /^([\d,]+)/.exec(stock.replace(/\(.*\)/, ''));
            var v = m ? T.num(m[1]) : 0;
            if (label.indexOf('上漲') === 0) breadth.up = v;
            else if (label.indexOf('下跌') === 0) breadth.down = v;
            else if (label.indexOf('持平') === 0) breadth.flat = v;
          });
        }
      }
      var H = qt.fields, ix = {};
      H.forEach(function (f, i) { ix[f.trim()] = i; });
      var stocks = {};
      qt.data.forEach(function (row) {
        var code = String(row[ix['證券代號']] || '').trim();
        if (!/^\d{4}[A-Z]?$/.test(code)) return;              // 只留個股/ETF（4 碼），排除權證
        var close = T.num(row[ix['收盤價']]);
        if (!isFinite(close)) return;
        var chg = (T.signStr(row[ix['漲跌(+/-)']]) === '-' ? -1 : 1) * T.num(row[ix['漲跌價差']]);
        if (!isFinite(chg)) chg = 0;
        var prev = close - chg;
        stocks[code] = {
          code: code,
          name: String(row[ix['證券名稱']] || '').trim(),
          close: close, open: T.num(row[ix['開盤價']]), high: T.num(row[ix['最高價']]),
          low: T.num(row[ix['最低價']]),
          vol: T.num(row[ix['成交股數']]), value: T.num(row[ix['成交金額']]),
          change: chg, pct: prev > 0 ? chg / prev * 100 : 0,
          pe: T.num(row[ix['本益比']])
        };
      });
      return { date: iso, index: idx, breadth: breadth, stocks: stocks };
    });
}

/* ---------------- 三大法人（每日一次，全市場） ---------------- */
function parseT86(j) {
  var H = j.fields || [], ix = {};
  H.forEach(function (f, i) { ix[f] = i; });
  var ci = 0, ni = 1;
  var fBuy = -1, tBuy = -1, dBuy = -1;
  H.forEach(function (f, i) {

    ? T.fmt(shares, 0) + ' 股（約 ' + (shares / 1000).toFixed(1) + ' 張）'
    : T.fmt(shares, 0) + ' 股';
  return {
    entry: a.close,
    pullback: isFinite(a.ma20) && a.ma20 < a.close ? a.ma20 : a.close * 0.98,
    stop: stop, dist: dist, distPct: dist / a.close * 100,
    t1: a.close + 2 * dist, t2: a.close + 3 * dist, hi60: a.hi60,
    shares: shares, lotText: lotText, riskAmt: shares * dist,
    riskPctOfCapital: shares * dist / cfg.capital * 100
  };
}

/* ---------------- 持股訊號 ---------------- */
function holdingSignal(pos, a, cfg) {
  if (!a) return { v: '無資料', cls: 'warnp', reasons: ['抓不到歷史資料'] };
  var pl = planOf(a, cfg);
  var cost = pos.cost > 0 ? pos.cost : a.close;
  var pnlPct = (a.close - cost) / cost * 100;
  var reasons = [];
  var v = '續抱', cls = 'hold';
  var stop = pos.stopOverride || pl.stop;
  if (a.close <= stop) { v = '觸發停損'; cls = 'cut'; reasons.push('現價 ' + T.fmtPx(a.close) + ' 已跌破停損 ' + T.fmtPx(stop)); }
  else if (pnlPct >= 20) { v = '分批停利'; cls = 'warnp'; reasons.push('獲利 ' + T.fmt(pnlPct, 1) + '%，可先出一半'); }
  else if (pnlPct <= -10) { v = '虧損警戒'; cls = 'warnp'; reasons.push('未實現虧損 ' + T.fmt(pnlPct, 1) + '%，請確認進場理由是否還成立'); }
  if (a.close < a.ma20 && a.close < a.ma5) { if (cls !== 'cut') { v = '減碼'; cls = 'cut'; } reasons.push('跌破 5 日與 20 日均線'); }
  if (a.gapWarn) reasons.push('近 60 日有大跳空，可能是除權息，均線僅供參考');
  var c = a.chip;
  if (c && c.negStreak >= 3) { reasons.push('法人連賣 ' + c.negStreak + ' 日'); if (cls === 'hold') { v = '籌碼轉弱'; cls = 'warnp'; } }
  else if (c && c.streak >= 3) reasons.push('法人連買 ' + c.streak + ' 日');
  var sc = scoreOf(a);
  if (cls === 'hold' && sc.score >= 70 && a.close > a.ma20) { v = '偏多續抱'; reasons.push('技術面 ' + sc.score + ' 分，站上月線'); }
  if (!reasons.length) reasons.push('尚無明顯訊號，依原計畫持有');
  return { v: v, cls: cls, reasons: reasons, pnlPct: pnlPct, score: sc.score, plan: pl, stop: stop, analysis: a };
}

/* ---------------- 大盤狀態（擇時） ---------------- */
function regime() {
  var m = T.DCACHE.market, b = T.DCACHE.snapshot && T.DCACHE.snapshot.breadth;
  if (!m || !isFinite(m.close)) return { state: '未知', exposure: 50, text: '尚無大盤資料', tone: 'warn' };
  var above20 = m.close > m.ma20, above60 = m.close > m.ma60, ma20Up = m.ma20 > m.ma60;
  var state, exposure, tone, text;
  if (above20 && above60 && ma20Up) {
    state = '多頭順風'; exposure = 100; tone = 'bull';
    text = '指數站上月線與季線、月線在季線之上，可正常配置。';
  } else if (above60) {
    state = '高檔震盪'; exposure = 60; tone = 'warn';
    text = '指數仍在季線之上但短線轉弱，建議降低部位、只留強勢股。';
  } else {
    state = '空頭逆風'; exposure = 30; tone = 'bear';
    text = '指數跌破季線，先保住現金；新單減量、停損從嚴。';
  }
  var breadth = b && (b.up + b.down) > 0 ? b.up / (b.up + b.down) * 100 : NaN;
  if (isFinite(breadth) && breadth < 35 && exposure > 60) { exposure = 60; text += ' 今日下跌家數偏多，先觀察。'; }
  var volNote = isFinite(m.volR) && m.volR < 0.8 ? '成交量低於 20 日均量，追價風險較高。' : '';
  return {
    state: state, exposure: exposure, tone: tone,
    text: text + (volNote ? ' ' + volNote : ''),
    index: m.close, pct: T.DCACHE.snapshot ? (T.DCACHE.snapshot.index.pct) : NaN,
    breadth: breadth, volR: m.volR
  };
}

/* 股數顯示：1,193 股 → 「1,193 股（約 1.2 張）」 */
function lotsText(shares) {
  if (!isFinite(shares)) return '—';
  return shares >= 1000 ? T.fmt(shares, 0) + ' 股（約 ' + (shares / 1000).toFixed(1) + ' 張）'
                        : T.fmt(shares, 0) + ' 股';

/* ---------------- 共用 ---------------- */
function histOf(code) {
  var c = T.DCACHE.hist[code];
  return (c && c.rows && c.rows.length) ? c.rows : null;
}
function chipOf(code) {
  var c = T.DCACHE.chips && T.DCACHE.chips.byCode[code];
  return c || null;
}
function analysisFor(code) {
  var rows = histOf(code);
  if (!rows) return null;
  var key = code + '@' + rows[rows.length - 1][0];
  if (!ANALYSIS[key]) ANALYSIS[key] = ST.analyze(code, rows, chipOf(code));
  return ANALYSIS[key];
}
function nameOf(code) { return D.stockName(code) || code; }
function px(c) { var s = T.DCACHE.snapshot && T.DCACHE.snapshot.stocks[c]; return s ? s : null; }

function sparkSVG(closes, w, h) {
  if (!closes || closes.length < 2) return '';
  var n = closes.length, mn = Math.min.apply(null, closes), mx = Math.max.apply(null, closes);
  if (mx === mn) { mx = mn + 1; }
  w = w || 120; h = h || 34;
  var pts = closes.map(function (v, i) {
    return (i / (n - 1) * w).toFixed(1) + ',' + (h - (v - mn) / (mx - mn) * (h - 4) - 2).toFixed(1);
  }).join(' ');
  var col = closes[n - 1] >= closes[0] ? 'var(--up)' : 'var(--dn)';
  var id = 'g' + Math.random().toString(36).slice(2, 7);
  return '<svg class="spark" viewBox="0 0 ' + w + ' ' + h + '" preserveAspectRatio="none">' +
    '<defs><linearGradient id="' + id + '" x1="0" y1="0" x2="0" y2="1">' +
    '<stop offset="0%" stop-color="' + col + '" stop-opacity=".35"/>' +
    '<stop offset="100%" stop-color="' + col + '" stop-opacity="0"/></linearGradient></defs>' +
    '<polygon points="0,' + h + ' ' + pts + ' ' + w + ',' + h + '" fill="url(#' + id + ')"/>' +
    '<polyline class="ln" points="' + pts + '" stroke="' + col + '"/></svg>';
}
function row2(label, value, cls) {
  return '<tr><td data-label="項目">' + T.esc(label) + '</td><td data-label="數值" class="' + (cls || '') + '">' + value + '</td></tr>';

/* ---------------- 掃描流程 ---------------- */
function scanProgress(msg) {
  PROGRESS = msg; renderHeader();
  var el = document.getElementById('scanProg');
  if (el) el.textContent = msg;
}
function scan() {
  var btn = document.getElementById('btnScan');
  if (btn) { btn.disabled = true; btn.textContent = '掃描中…'; }
  scanProgress('準備資料…');
  D.fresh(false).then(function () {
    var snap = T.DCACHE.snapshot, chips = T.DCACHE.chips && T.DCACHE.chips.byCode;
    if (!snap || !chips) throw new Error('沒有行情資料');
    var cands = [];
    for (var code in snap.stocks) {
      if (!Object.prototype.hasOwnProperty.call(snap.stocks, code)) continue;
      if (/^00/.test(code)) continue;                        // 排除 ETF
      if (!/^\d{4}$/.test(code)) continue;
      var s = snap.stocks[code];
      if (!isFinite(s.close) || s.close < 10) continue;
      if (!isFinite(s.vol) || s.vol / 1000 < S.cfg.scanMinLots) continue;
      var c = chips[code];
      if (!c) continue;
      var netVal = c.last * s.close;
      if (netVal < S.cfg.scanMinValue * 1e6) continue;
      cands.push({ code: code, netVal: netVal });
    }
    cands.sort(function (a, b) { return b.netVal - a.netVal; });
    var pool = cands.slice(0, Math.max(5, S.cfg.scanPool)).map(function (x) { return x.code; });
    /* 觀察清單一律納入 */
    S.watch.forEach(function (w) { if (pool.indexOf(w.code) < 0) pool.push(w.code); });
    if (!pool.length) throw new Error('今天沒有符合條件的個股，可到設定降低門檻');
    scanProgress('抓取 ' + pool.length + ' 檔日 K 資料…');
    return D.ensureHist(pool, function (done, total) { scanProgress('抓取日 K 資料 ' + done + '/' + total + '…'); })
      .then(function () {
        scanProgress('計算指標與評分…');
        var items = [];
        pool.forEach(function (code) {
          var a = analysisFor(code);
          if (!a) return;
          var sc = ST.scoreOf(a);
          var plan = ST.planOf(a, S.cfg);
          if (plan.distPct > S.cfg.maxStopPct) return;
          items.push({
            code: code, close: a.close, dayPct: a.dayPct,
            score: { score: sc.score, grade: sc.grade, tags: sc.tags.slice(0, 4) },
            plan: { entry: plan.entry, pullback: plan.pullback, stop: plan.stop, dist: plan.dist,
                    distPct: plan.distPct, t1: plan.t1, t2: plan.t2, hi60: plan.hi60,
                    shares: plan.shares, riskAmt: plan.riskAmt }
          });
        });
        items.sort(function (x, y) { return y.score.score - x.score.score; });
        items = items.slice(0, S.cfg.showN);
        S.scan = { v: SCAN_V, at: Date.now(), day: snap.date, items: items, pool: pool.length };
        T.saveState();
        return items.length;
      });
  }).then(function (n) {
    scanProgress('');
    PROGRESS = '';
    T.toast('掃描完成：' + n + ' 檔');
    render();
  }).catch(function (e) {
    scanProgress('');
    PROGRESS = '';
    var btn2 = document.getElementById('btnScan');
    if (btn2) { btn2.disabled = false; btn2.textContent = '開始掃描'; }
    T.toast('掃描失敗：' + (e && e.message ? e.message : e));
    render();
  });
}

/* ---------------- 更新資料 ---------------- */
function loadHistFor(codes) {
  if (!codes || !codes.length) return Promise.resolve();
  return D.ensureHist(codes, function (d, t) { PROGRESS = '日 K ' + d + '/' + t; renderHeader(); })
    .then(function () { PROGRESS = ''; renderHeader(); });
}
function refreshAll(force) {
  var codes = S.holdings.map(function (h) { return h.code; })
    .concat(S.watch.map(function (w) { return w.code; }));
  T.onProgress = function (msg) { PROGRESS = msg; renderHeader(); };
  PROGRESS = '更新資料…'; renderHeader();
  return D.fresh(force).then(function () {
    /* 先渲染一次（可能已有快取資料） */
    render();
    return D.ensureNameMap().catch(function () { return {}; });
  }).then(function () {
    if (!codes.length) { PROGRESS = ''; render(); return; }
    PROGRESS = '抓取持股日 K…'; renderHeader();
    return D.ensureHist(codes, function (d, t) { PROGRESS = '日 K ' + d + '/' + t; renderHeader(); });
  }).then(function () {
    PROGRESS = ''; render();
  }).catch(function (e) {
    PROGRESS = ''; render();
    T.toast('資料更新失敗：' + (e && e.message ? e.message : e) + '（顯示上次快取）');
  });
}

  var aEl = document.createElement('a');
  aEl.href = URL.createObjectURL(blob);
  aEl.download = '台股助手備份-' + T.todayISO(0) + '.json';
  document.body.appendChild(aEl); aEl.click(); aEl.remove();
  T.toast('已匯出備份檔');
}
function doImport() {
  var html = '<label class="f"><span class="lb">選擇備份檔</span><input type="file" id="impFile" accept="application/json,.json"></label>' +
    '<button class="btn primary block" data-act="doImportFile">匯入</button>';
  openSheet('匯入備份', html);
}
function importFile() {
  var f = document.getElementById('impFile').files[0];
  if (!f) return T.toast('請先選檔案');
  var fr = new FileReader();
  fr.onload = function () {
    try {
      var j = JSON.parse(fr.result);
      if (j.cfg) S.cfg = Object.assign({}, T.defaultCfg, j.cfg);
      if (Array.isArray(j.holdings)) S.holdings = j.holdings;
      if (Array.isArray(j.watch)) S.watch = j.watch;
      if (j.scan) S.scan = j.scan;
      T.saveState(); closeSheet(); T.toast('匯入完成');
      render(); refreshAll(false);
    } catch (e) { T.toast('檔案格式錯誤'); }
  };
  fr.readAsText(f);
}

/* ---------------- 事件 ---------------- */
function render() {
  renderHeader();
  var tab = S.tab;
  if (tab === 'home') renderHome();
  else if (tab === 'hold') renderHold();
  else if (tab === 'pick') renderPick();
  else renderCfg();
  var tabs = document.querySelectorAll('#tabs button');
  for (var i = 0; i < tabs.length; i++) {
    tabs[i].classList.toggle('on', tabs[i].getAttribute('data-tab') === tab);
  }
  window.scrollTo(0, 0);
  checkAlerts();
}
var alertShown = false;
function checkAlerts() {
  if (alertShown || !S.holdings.length) return;
  var cut = 0;
  S.holdings.forEach(function (h) {
    var a = analysisFor(h.code);
    if (!a) return;
    var sig = ST.holdingSignal(h, a, S.cfg);
    if (sig.cls === 'cut') cut++;
  });
  if (cut) { alertShown = true; T.toast('⚠ 有 ' + cut + ' 檔持股觸發停損／減碼訊號', 3200); }
}
function bindEvents() {
  document.getElementById('tabs').addEventListener('click', function (e) {
    var b = e.target.closest('button[data-tab]');
    if (!b) return;
    S.tab = b.getAttribute('data-tab'); T.saveState(); render();
  });
  document.getElementById('btnRefresh').addEventListener('click', function () {
    alertShown = false;
    refreshAll(true).then(function () { T.toast('已更新'); });
  });
  document.getElementById('view').addEventListener('click', onAction);
  document.getElementById('modalRoot').addEventListener('click', onAction);
}
function onAction(e) {
  var el = e.target.closest('[data-act]');
  if (!el) return;
  var act = el.getAttribute('data-act');
  var code = el.getAttribute('data-code');
  if (act === 'tab') { S.tab = el.getAttribute('data-tab'); T.saveState(); render(); return; }
  if (act === 'detail') { openDetail(code); return; }
  if (act === 'closeSheet') { closeSheet(); return; }
  if (act === 'scan') { scan(); return; }
  if (act === 'addHold') { openHoldForm(code); return; }
  if (act === 'saveHold') { saveHoldForm(); return; }
  if (act === 'delHold') {
    S.holdings = S.holdings.filter(function (h) { return h.code !== code; });
    T.saveState(); closeSheet(); render(); T.toast('已刪除'); return;
  }
  if (act === 'addWatch') { openWatchForm(''); return; }
  if (act === 'saveWatch') { saveWatchForm(); return; }
  if (act === 'watch') {
    if (!S.watch.some(function (w) { return w.code === code; })) S.watch.push({ code: code });
    T.saveState(); closeSheet(); render(); T.toast('已加入觀察'); return;
  }
  if (act === 'unwatch') {
    S.watch = S.watch.filter(function (w) { return w.code !== code; });
    T.saveState(); closeSheet(); render(); T.toast('已移除'); return;
  }
  if (act === 'toHold') { openHoldForm(code); return; }
  if (act === 'hist') { openHistTable(code); return; }
  if (act === 'export') { doExport(); return; }
  if (act === 'import') { doImport(); return; }
  if (act === 'doImportFile') { importFile(); return; }
  if (act === 'saveCfg') { saveCfg(); return; }
}
function saveCfg() {
  function v(id, def) { var el = document.getElementById(id); var x = parseFloat(el && el.value); return isFinite(x) ? x : def; }
  S.cfg.capital = v('cfCap', 1000000);
  S.cfg.riskPct = v('cfRisk', 1);
  S.cfg.atrK = v('cfAtrK', 2);
  S.cfg.maxStopPct = v('cfMaxStop', 10);
  S.cfg.scanMinLots = v('cfMinLots', 2000);
  S.cfg.scanMinValue = v('cfMinVal', 50);
  S.cfg.scanPool = v('cfPool', 30);
  S.cfg.showN = v('cfShowN', 15);
  var sm = document.getElementById('cfStopMode'); if (sm) S.cfg.stopMode = sm.value;
  var lt = document.getElementById('cfLot'); if (lt) S.cfg.minLot = parseInt(lt.value, 10);
  T.saveState(); T.toast('設定已儲存'); render();
}

/* ---------------- 啟動 ---------------- */
function init() {
  bindEvents();
  render();
  if ('serviceWorker' in navigator && location.protocol === 'https:') {
    navigator.serviceWorker.register('sw.js').catch(function () {});
  }
  refreshAll(false);
}
window.UI = { render: render, openDetail: openDetail, analysisFor: function (c) { return analysisFor(c); },
  scan: scan, refreshAll: refreshAll, histTable: openHistTable, openHoldForm: openHoldForm,
  saveHoldForm: saveHoldForm, openWatchForm: openWatchForm, saveWatchForm: saveWatchForm,
  saveCfg: saveCfg, state: S, analysisCache: ANALYSIS };
if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
else init();
})();

</script>
</body>
</html>
