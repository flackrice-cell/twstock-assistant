    fld('scanMinValue', '法人買超門檻（百萬元）', c.scanMinValue, '當日法人買超未達這個金額就不列入候選，預設 50') +
    fld('scanPool', '進入評分的檔數', c.scanPool, '候選取前幾名做完整技術分析，預設 30') +
    sel('scanAny', '是否包含上櫃股', c.scanAny ? 1 : 0, [[0, '只掃上市（快）'], [1, '含上櫃（較慢）']]) +
    '</div>';
  h += '<div class="card"><h3 style="font-size:15px">🌏 資料來源</h3>' +
    sel('intlEnabled', '國際盤勢', c.intlEnabled ? 1 : 0, [[1, '開啟（費半、美股、匯率、ADR）'], [0, '關閉']]) +
    fld('finmindToken', 'FinMind token（選填）', c.finmindToken, '免費額度用完時可到 finmindtrade.com 註冊取得 token 貼上，額度會提高') +
    fld('feeDiscount', '手續費折扣（電子下單）', c.feeDiscount, '常見 6 折 → 填 0.6；不確定就保持 0.6') +
    fld('simCapital', '模擬帳戶起始資金', c.simCapital) +
    '</div>';
  h += '<div class="row"><button class="btn primary block" data-act="saveCfg">儲存設定</button></div>';
  h += '<div class="row" style="margin-top:9px"><button class="btn sm ghost" data-act="export">匯出備份 JSON</button>' +
    '<button class="btn sm ghost" data-act="import">匯入備份</button></div>';
  h += '<div class="card" style="margin-top:12px"><h3 style="font-size:14.5px">📖 這套軟體怎麼運作</h3><ul class="bullets">' +
    '<li><b>它不會告訴你明天漲不漲。</b>它做的是：每天把全市場資料算一遍，找出「趨勢、籌碼、基本面、風險」四個角度都還不錯的股票，並且明確告訴你「什麼價格該認錯出場」。</li>' +
    '<li><b>真正決定賺賠的是停損。</b>這個工具最核心的功能是幫你算出「買幾股、停損放哪裡」，讓每一筆的最大虧損都固定在總資金的 ' + T.fmt(S.cfg.riskPct, 1) + '%。</li>' +
    '<li><b>先用模擬帳戶練 2～4 週。</b>重點是記錄你有沒有照計畫做，而不是賺多少。</li>' +
    '<li><b>資料限制（誠實說明）：</b>①盤後資料，約 14:30 後更新，不是即時報價；②價格未還原權息，除權息當天均線會失真（系統會提醒）；③全市場掃描只涵蓋上市股；④所有設定與持股只存在你這支手機，不會上傳，請定期匯出備份。</li>' +
    '</ul></div>';
  h += '<div class="note sm center" style="padding:10px">版本 v2.0 · 資料來源：證交所公開資料 / FinMind / Yahoo Finance<br>本工具僅供研究與學習，不構成任何投資建議。</div>';
  return h;
}
function fld(id, label, val, hint) {
  return '<label class="f"><span class="lb">' + T.esc(label) + '</span>' +
    '<input type="text" inputmode="decimal" id="cfg_' + id + '" value="' + T.esc(val === null || val === undefined ? '' : val) + '">' +
    (hint ? '<span class="mut2 tiny">' + T.esc(hint) + '</span>' : '') + '</label>';
}
function sel(id, label, val, opts) {
  return '<label class="f"><span class="lb">' + T.esc(label) + '</span><select id="cfg_' + id + '">' +
    opts.map(function (o) { return '<option value="' + o[0] + '"' + (String(o[0]) === String(val) ? ' selected' : '') + '>' + T.esc(o[1]) + '</option>'; }).join('') +
    '</select></label>';
}

/* ---------------- 個股分析頁 ---------------- */
function openDetail(code) {
  U.code = code;
  var a = analysisFor(code);
  var h = '<div class="modal" data-act="bgClose"><div class="sheet" data-stop="1">';
  h += '<div class="row"><div class="avatar">' + iconOf(code) + '</div>' +
    '<div><div style="font-weight:800;font-size:17px">' + T.esc(nameOf(code)) + ' <span class="mut2 tiny">' + code + '</span></div>' +
    '<div class="mut2 tiny">' + T.esc(D.stockIndustry(code) || '—') + ' · ' + T.esc(D.marketType(code) === 'otc' ? '上櫃' : '上市') + '</div></div>' +
    '<span class="sp"></span><button class="iconbtn" data-act="closeSheet">✕</button></div>';

  if (!a) {
    h += '<div class="card" style="margin-top:12px"><div class="loading"><span class="spin"></span>正在下載歷史資料…</div></div></div></div>';
    $('modalRoot').innerHTML = h;
    T.DCACHE.hist[code] = T.DCACHE.hist[code] || null;
    D.histFor(code).then(function () { ANALYSIS = {}; openDetail(code); })
      .catch(function (e) { toast('歷史資料抓取失敗：' + (e && e.message || e)); });
    return;
  }
  var st = px(code);
  var pct = st ? st.pct : a.dayPct;
  h += '<div class="row" style="margin-top:10px"><div><div class="big ' + toneCls(pct) + '">' + T.fmtPx(a.close) + '</div>' +
    '<div class="' + toneCls(pct) + ' sm">' + T.fmtPct(pct) + '　<span class="mut2">' + T.esc(T.DCACHE.day || '') + '</span></div></div>' +
    '<span class="sp"></span><div class="r">' + (st ? '<div class="mut2 tiny">開 ' + T.fmtPx(st.open) + ' / 高 ' + T.fmtPx(st.high) + ' / 低 ' + T.fmtPx(st.low) + '</div>' +
      '<div class="mut2 tiny">量 ' + T.fmt((st.vol || 0) / 1000, 0) + ' 張 · 量比 ' + T.fmt(a.volR, 2) + '</div>' : '') + '</div></div>';

  /* 計算各項分析 */
  var per = D.perOf(code), rev = (U.rev[code] && !U.rev[code].none) ? U.rev[code] : null, news = U.news[code] || null;
  var sent = ST.newsSentiment(news);
  var rg = ST.regime();
  var snow = ST.snowflake(a, per, rev, sent);
  var nd = { analysis: a, per: per, rev: rev, regime: rg };
  var pl = ST.planOf(a, S.cfg);
  nd.lotText = pl.lotText;
  var vd = ST.verdict(nd);
  var ana = ST.analysts(a, per, rev, sent, rg);
  var attr = ST.attribution(a, sent);
  var rs = ST.relStrength(a);

  /* 1. 結論 */
  h += '<div class="card glow" style="margin-top:11px">' +
    '<div class="row"><div class="verdict ' + (vd.tone === 'up' ? 'up' : vd.tone === 'dn' ? 'dn' : vd.tone === 'ac' ? '' : 'mut') + '">' + T.esc(vd.label) + '</div>' +
    '<span class="sp"></span><span class="chip ' + (vd.tone === 'up' ? 'bull' : vd.tone === 'dn' ? 'bear' : 'warn') + '">綜合 ' + vd.total + ' 分</span></div>' +
    '<div class="note sm" style="margin-top:6px">' + T.esc(snowCoverageText(snow)) + '</div>' +
    '<div class="hr"></div><div class="mut tiny">為什麼（白話）</div><ul class="bullets">' +
    vd.why.slice(0, 4).map(function (t) { return '<li>' + T.esc(t) + '</li>'; }).join('') + '</ul>' +
    '<div class="mut tiny" style="margin-top:8px">如果要買，這樣做</div><ul class="bullets">' +
    vd.how.map(function (t) { return '<li>' + T.esc(t) + '</li>'; }).join('') + '</ul>' +
    '<div class="hint bad" style="margin-top:9px"><b>什麼情況要承認看錯：</b><ul class="bullets">' +
    vd.risk.map(function (t) { return '<li>' + T.esc(t) + '</li>'; }).join('') + '</ul></div></div>';

  /* 2. 評分儀表 + 五力 */
  h += '<div class="card"><div class="mut sm" style="margin-bottom:2px">技術評分儀表</div>' + CH.gauge(vd.parts.tech) +
    '<div class="grid4 tiny" style="margin-top:6px">' +
    subScore('技術', vd.parts.tech) + subScore('籌碼', vd.parts.chip) + subScore('基本面', vd.parts.fund) + subScore('風險', vd.parts.risk) + '</div>' +
    '<div class="hr"></div><div class="mut sm">五力評估（雪花圖）：看哪一項強、哪一項弱</div>' + CH.radar(snow.axes) +
    '<div style="margin-top:4px">' + snow.axes.map(function (x) {
      return '<div class="row tiny" style="padding:4px 0;border-bottom:1px solid var(--bd)"><b style="width:42px">' + T.esc(x.label) + '</b>' +
        '<span class="' + (x.score === null ? 'mut2' : x.score >= 7 ? 'up' : x.score >= 5 ? '' : 'dn') + '" style="width:34px">' +
        (x.score === null ? '—' : x.score + '/10') + '</span><span class="mut" style="flex:1">' + T.esc(x.note) + '</span></div>';
    }).join('') + '</div></div>';

  /* 3. K 線 */
  h += '<div class="card"><div class="row"><div class="mut sm">價格走勢</div><span class="sp"></span>' +
    '<div class="seg">' + ['1M', '3M', '6M', '1Y'].map(function (p) {
      return '<button data-act="period" data-p="' + p + '" class="' + (U.period === p ? 'on' : '') + '">' + p + '</button>';
    }).join('') + '</div></div>' +
    '<div style="margin-top:8px">' + CH.candles(a.rows, { days: PERIODS[U.period], stop: pl.stop, target: pl.t1, ma: U.period === '1Y' ? [20, 60] : [5, 20] }) + '</div></div>';

  /* 4. 交易計畫 */
  h += '<div class="card"><div class="mut sm">交易計畫（以 ' + T.fmtMoney(S.cfg.capital) + ' 資金、單筆風險 ' + T.fmt(S.cfg.riskPct, 1) + '% 計算）</div>' +
    '<div class="grid2" style="margin-top:8px">' +
    kvBox('進場參考', T.fmtPx(pl.entry), '') +
    kvBox('停損價', T.fmtPx(pl.stop), 'warnp') +
    kvBox('第一目標', T.fmtPx(pl.t1), '') +
    kvBox('建議股數', pl.lotText, '') + '</div>' +
    '<div class="note sm" style="margin-top:8px">停損距離 ' + T.fmt(pl.distPct, 1) + '%（每天平均波動 ' + T.fmt(a.atrPct, 1) + '%）' +
    (pl.distPct >= S.cfg.maxStopPct - 0.05 ? '，波動大已用上限' : '') + '。這筆最大虧損約 ' + T.fmtMoney(pl.riskAmt) + '（總資金的 ' + T.fmt(pl.riskPctOfCapital, 2) + '%）。' +
    '風報比 1:2 → 目標 ' + T.fmtPx(pl.t1) + '，中途可回月線 ' + T.fmtPx(pl.pullback) + ' 附近觀察支撐。</div>' +
    '<div class="row" style="margin-top:10px"><button class="btn buy" data-act="simBuySheet" data-code="' + code + '">🎯 模擬買進</button>' +
    '<button class="btn primary" data-act="addHoldCode" data-code="' + code + '">＋ 記錄持股</button>' +
    '<button class="btn ghost" data-act="addWatchCode" data-code="' + code + '">觀察</button></div></div>';

  /* 5. 分析師團隊 */
  var bull = ana.filter(function (x) { return /偏多|風險可控/.test(x.stance); }).length;
  var bear = ana.filter(function (x) { return /偏空|風險偏高/.test(x.stance); }).length;
  var neut = 4 - bull - bear;
  h += '<div class="card"><div class="mut sm">分析師團隊怎麼看（4 個角度，規則式判斷）</div>' +
    '<div class="wall"><div class="b"><b class="up">' + bull + '</b><span>看多</span></div>' +
    '<div class="b"><b class="mut">' + neut + '</b><span>中性</span></div>' +
    '<div class="b"><b class="dn">' + bear + '</b><span>偏空／風險</span></div></div>' +
    ana.map(function (x) {
      return '<div class="analyst"><div class="avatar">' + x.icon + '</div><div style="flex:1">' +
        '<div class="row"><b style="font-size:13.5px">' + T.esc(x.role) + '</b><span class="sp"></span>' +
        '<span class="pill ' + (/偏多|風險可控/.test(x.stance) ? 'buy' : /偏空|風險偏高/.test(x.stance) ? 'cut' : 'hold') + '">' +
        T.esc(x.stance) + ' · ' + x.conf + '</span></div>' +
        '<ul class="bullets">' + x.lines.map(function (l) { return '<li>' + T.esc(l) + '</li>'; }).join('') + '</ul></div></div>';
    }).join('') +
    '<div class="mut2 tiny">※ 這四位是系統用固定規則扮演的分析角度，不是真人、也不是券商研究報告。目的是讓你看見「同一個價格，不同角度會怎麼解讀」。</div></div>';

  /* 6. 漲跌原因 */
  h += '<div class="card"><div class="mut sm">今天為什麼這樣走</div>' +
    '<div style="margin-top:6px;font-size:14px">' + T.esc(attr.text) + '</div>' +
    '<div class="row wrap" style="margin-top:8px">' + attr.tags.map(function (t) { return pill(t, 'hold'); }).join('') + '</div>' +
    '<div class="note sm" style="margin-top:8px">個股 ' + T.fmtPct(a.dayPct) + ' vs 大盤 ' + T.fmtPct(attr.market) +
    (attr.industryName ? ' vs ' + T.esc(CH.shortInd(attr.industryName)) + ' ' + T.fmtPct(attr.industry) : '') +
    '。判斷原則是：跟大盤差不多 → 系統性因素；跟類股同步 → 產業因素；明顯偏離類股 → 個股自己的消息。</div></div>';

  /* 7. 相對強度 */
  if (rs) {
    h += '<div class="card"><div class="row"><div class="mut sm">相對大盤強度（RS）</div><span class="sp"></span>' +
      '<span class="chip ' + (rs.rating >= 70 ? 'bull' : rs.rating <= 30 ? 'bear' : 'info') + '">' + rs.rating + ' / 99</span></div>' +
      CH.rsline(rs.line) +
      '<div class="note sm">過去 ' + rs.days + ' 個交易日，這檔股票' + (rs.excess >= 0 ? '贏' : '輸') + '大盤 <b>' + T.fmt(Math.abs(rs.excess), 1) + '%</b>' +
      '（個股 ' + T.fmtPct(rs.stockRet) + '、大盤 ' + T.fmtPct(rs.mktRet) + '）。分數愈高代表愈強勢；線往右上走＝持續打敗大盤。</div></div>';
  }

  /* 8. 新聞 */
  h += '<div class="card"><div class="row"><div class="mut sm">相關新聞</div><span class="sp"></span>' +
    (sent ? '<span class="chip ' + (sent.score > 15 ? 'bull' : sent.score < -15 ? 'bear' : 'info') + '">' + T.esc(sent.label) + '</span>' : '') +
    '<button class="btn sm ghost" data-act="newsRefresh" data-code="' + code + '">更新</button></div>';
  if (!news) h += '<div class="loading"><span class="spin"></span>正在抓取新聞…</div>';
  else if (!news.length) h += '<div class="note sm">最近 35 天沒有抓到這檔的新聞（或 FinMind 額度暫時用完）。</div>';
  else {
    h += news.slice(0, 8).map(function (n) {
      return '<div class="news"><a href="' + T.esc(n.link || '#') + '" target="_blank" rel="noopener">' + T.esc(n.title) + '</a>' +
        '<div class="meta">' + T.esc(n.date) + ' · ' + T.esc(n.source || '') + '</div></div>';
    }).join('');
    h += '<div class="mut2 tiny" style="margin-top:6px">新聞標題情緒是用中文財經關鍵詞規則判斷（' + sent.pos + ' 則偏多 / ' + sent.neg + ' 則偏空 / 共看 ' + sent.scanned + ' 則），僅供參考。</div>';
  }
  h += '</div>';

  /* 9. 詳細數據 */
  h += '<details class="dt"><summary>📐 技術面數字</summary><table class="t" style="margin-top:8px">' +
    row2('收盤價', T.fmtPx(a.close), toneCls(a.dayPct)) +
    row2('5 日均線', T.fmtPx(a.ma5), a.close > a.ma5 ? 'up' : 'dn') +
    row2('20 日均線（月線）', T.fmtPx(a.ma20), a.close > a.ma20 ? 'up' : 'dn') +
    row2('60 日均線（季線）', T.fmtPx(a.ma60), a.close > a.ma60 ? 'up' : 'dn') +
    row2('距月線乖離', T.fmtPct(a.bias20), Math.abs(a.bias20) > 12 ? 'warnp' : '') +
    row2('KD', T.fmt(a.k, 1) + ' / ' + T.fmt(a.d, 1), a.k > a.d ? 'up' : 'dn') +
    row2('MACD 柱狀', T.fmt(a.osc, 3), a.osc > 0 ? 'up' : 'dn') +
    row2('RSI', T.fmt(a.rsi, 1), a.rsi > 70 ? 'dn' : a.rsi < 30 ? 'up' : '') +
    row2('近 5 / 20 / 60 日漲幅', T.fmtPct(a.r5, 1) + ' / ' + T.fmtPct(a.r20, 1) + ' / ' + T.fmtPct(a.r60, 1), toneCls(a.r20)) +
    row2('60 日高 / 低', T.fmtPx(a.hi60) + ' / ' + T.fmtPx(a.lo60), '') +
    row2('日波動（ATR）', T.fmt(a.atr, 2) + ' 元（' + T.fmt(a.atrPct, 1) + '%）', '') +
    row2('成交量 / 均量', T.fmt((a.vol || 0) / 1000, 0) + ' 張（' + T.fmt(a.volR, 2) + ' 倍）', a.volR > 1.3 ? 'up' : a.volR < 0.7 ? 'dn' : '') +
    '</table></details>';

  var c = a.chip;
  h += '<details class="dt"><summary>🏦 法人籌碼（外資、投信、自營商）</summary>' +
    (c ? '<table class="t" style="margin-top:8px">' +
      row2('最近一日合計', T.fmt(c.last / 1000, 0) + ' 張（' + T.fmtMoney(a.close * c.last) + '）', toneCls(c.last)) +
      row2('外資（最近一日）', T.fmt(c.f1 / 1000, 0) + ' 張', toneCls(c.f1)) +
      row2('投信（最近一日）', T.fmt(c.t1 / 1000, 0) + ' 張', toneCls(c.t1)) +
      row2('近 5 日合計', T.fmt(c.i5 / 1000, 0) + ' 張', toneCls(c.i5)) +
      row2('外資（近 5 日）', T.fmt(c.f5 / 1000, 0) + ' 張', toneCls(c.f5)) +
      row2('投信（近 5 日）', T.fmt(c.t5 / 1000, 0) + ' 張', toneCls(c.t5)) +
      row2('連續買 / 賣天數', c.streak + ' 買 / ' + c.negStreak + ' 賣', '') +
      row2('統計天數', c.days + ' 個交易日', '') +
      '</table><div class="note sm" style="margin-top:7px">法人＝外資、投信、自營商。連續買超代表大戶在收籌碼，通常是好事，但要搭配價格位置看（高檔爆買也可能是隔日沖）。</div>'
      : '<div class="note sm" style="margin-top:8px">查不到法人資料（可能是上櫃股，或當日資料還沒公布）。</div>') + '</details>';

  h += '<details class="dt"><summary>📊 基本面（本益比、殖利率、營收）</summary><table class="t" style="margin-top:8px">' +
    row2('本益比', per && isFinite(per.pe) ? T.fmt(per.pe, 2) + ' 倍' : '—', '') +
    row2('現金殖利率', per && isFinite(per.yld) ? T.fmt(per.yld, 2) + '%' : '—', '') +
    row2('股價淨值比', per && isFinite(per.pbr) ? T.fmt(per.pbr, 2) + ' 倍' : '—', '') +
    row2('大盤本益比中位數', ST.medianPE() ? T.fmt(ST.medianPE(), 1) + ' 倍' : '—', '') +
    (rev ? row2('最新月營收', T.fmtMoney(rev.rev) + '（' + rev.y + '/' + rev.m + '）', '') : '') +
    (rev && isFinite(rev.yoy) ? row2('月營收年增率', T.fmtPct(rev.yoy), toneCls(rev.yoy)) : '') +
    (rev && isFinite(rev.mom) ? row2('月營收月增率', T.fmtPct(rev.mom), toneCls(rev.mom)) : '') +
    '</table>' +
    (rev && rev.history ? '<div style="margin-top:10px" class="mut sm">近 13 個月營收</div>' + CH.bars(rev.history) : '') +
    '<div class="note sm" style="margin-top:8px">本益比＝股價 ÷ 每年每股盈餘，數字愈低代表愈便宜（但成長股通常比較貴）。殖利率＝每年配息 ÷ 股價。</div></details>';

  /* 10. 筆記 */
  h += '<div class="card"><div class="mut sm">我的筆記</div>' +
    '<label class="f" style="margin-top:6px"><textarea id="note_' + code + '" rows="3" style="width:100%;background:var(--card2);color:var(--fg);border:1px solid var(--bd2);border-radius:12px;padding:10px;font-size:15px">' +
    T.esc(S.notes[code] || '') + '</textarea></label>' +
    '<button class="btn sm" data-act="saveNote" data-code="' + code + '">儲存筆記</button></div>';

  h += '<div class="mut2 tiny center" style="padding:6px 0 14px">資料為盤後資訊，非即時報價，未還原權息；本頁僅供研究參考，不構成投資建議。</div>';
  h += '</div></div>';
  $('modalRoot').innerHTML = h;

  /* 非同步補資料：月營收 / 新聞 */
  if (!U.rev[code]) {
    D.fetchRevenue(code).then(function (r) { U.rev[code] = r || { none: true }; if (U.code === code) openDetail(code); });
  }
  if (!U.news[code]) {
    D.fetchNews(code).then(function (n) { U.news[code] = n || []; if (U.code === code) openDetail(code); });
  }
}

function snowCoverageText(snow) {
  if (snow.coverage === 5) return '五力資料完整（5/5 項）。';
  return '五力中 ' + snow.coverage + '/5 項有資料，缺的項目不列入平均（不會用 0 分拖累）。';
}
function subScore(label, v) {
  var col = v >= 65 ? 'up' : v >= 45 ? '' : 'dn';
  return '<div class="kv"><div class="k">' + T.esc(label) + '</div><div class="v ' + col + '">' + v + '</div></div>';
}
function kvBox(label, value, cls) {
  return '<div class="kv"><div class="k">' + T.esc(label) + '</div><div class="v ' + (cls === 'warnp' ? 'dn' : '') + '">' + value + '</div></div>';
}

/* ---------------- 小表單 sheet ---------------- */
function sheetBody(title, inner) {
  return '<div class="modal" data-act="bgClose"><div class="sheet" data-stop="1">' +
    '<div class="row"><h3>' + T.esc(title) + '</h3><span class="sp"></span><button class="iconbtn" data-act="closeSheet">✕</button></div>' +
    '<div style="margin-top:12px">' + inner + '</div></div></div>';
}
function closeSheet() { $('modalRoot').innerHTML = ''; U.code = null; }

function addHoldSheet(code) {
  var pre = code || '';
  var p = code ? (px(code) ? px(code).close : NaN) : NaN;
  $('modalRoot').innerHTML = sheetBody(code ? '記錄持股：' + nameOf(code) : '新增持股',
    '<label class="f"><span class="lb">股票代號（4 位數字）</span><input type="text" inputmode="numeric" id="h_code" value="' + T.esc(pre) + '"' + (code ? ' readonly' : '') + ' placeholder="例如 2330"></label>' +
    '<label class="f"><span class="lb">買進成本（每股）</span><input type="text" inputmode="decimal" id="h_cost" value="' + (isFinite(p) ? p : '') + '"></label>' +
    '<label class="f"><span class="lb">股數</span><input type="text" inputmode="numeric" id="h_shares" value="1000"></label>' +
    '<label class="f"><span class="lb">停損價（選填，留空＝系統自動算）</span><input type="text" inputmode="decimal" id="h_stop" value=""></label>' +
    '<button class="btn primary block" data-act="saveHold">儲存</button>');
}
function addWatchSheet(code) {
  $('modalRoot').innerHTML = sheetBody('加入觀察名單',
    '<label class="f"><span class="lb">股票代號</span><input type="text" inputmode="numeric" id="w_code" value="' + T.esc(code || '') + '"' + (code ? ' readonly' : '') + ' placeholder="例如 2317"></label>' +
    '<label class="f"><span class="lb">想觀察的原因（選填）</span><input type="text" id="w_reason" value="" placeholder="例如 等回測月線"></label>' +
    '<button class="btn primary block" data-act="saveWatch">加入</button>');
}
function simBuySheet(code) {
  var a = analysisFor(code);
  var pl = a ? ST.planOf(a, S.cfg) : null;
  var price = SIM.priceOf(code);
  $('modalRoot').innerHTML = sheetBody('模擬買進：' + nameOf(code),
    '<div class="note sm">模擬帳戶可用現金 ' + T.fmtMoney(T.S.sim.cash) + '</div>' +
    (pl ? '<div class="note sm" style="margin-top:6px">依你的設定（' + T.fmtMoney(S.cfg.capital) + '、風險 ' + T.fmt(S.cfg.riskPct, 1) + '%）建議買 ' + pl.lotText + '，停損 ' + T.fmtPx(pl.stop) + '。</div>' : '') +
    '<label class="f" style="margin-top:10px"><span class="lb">成交價（預設今日收盤）</span><input type="text" inputmode="decimal" id="s_price" value="' + (isFinite(price) ? price : '') + '"></label>' +
    '<label class="f"><span class="lb">股數（1 張＝1000 股）</span><input type="text" inputmode="numeric" id="s_shares" value="' + (pl ? pl.shares : 1000) + '"></label>' +
    '<label class="f"><span class="lb">備註（為什麼買）</span><input type="text" id="s_note" value=""></label>' +
    '<button class="btn buy block" data-act="simBuyGo" data-code="' + code + '">確認買進</button>');
}
function sellSheet(code) {
  var p = null;
  T.S.sim.positions.forEach(function (x) { if (x.code === code) p = x; });
  var price = SIM.priceOf(code);
  $('modalRoot').innerHTML = sheetBody('模擬賣出：' + nameOf(code),
    (p ? '<div class="note sm">持有 ' + T.fmt(p.shares, 0) + ' 股，成本 ' + T.fmtPx(p.cost) + '，現價 ' + T.fmtPx(price) + '，未實現 ' + T.fmtPct((price - p.cost) / p.cost * 100, 1) + '</div>' : '<div class="note sm">沒有模擬持股</div>') +
    '<label class="f" style="margin-top:10px"><span class="lb">成交價</span><input type="text" inputmode="decimal" id="s_price" value="' + (isFinite(price) ? price : '') + '"></label>' +
    '<label class="f"><span class="lb">股數（留空＝全部）</span><input type="text" inputmode="numeric" id="s_shares" value=""></label>' +
    '<label class="f"><span class="lb">備註（為什麼賣）</span><input type="text" id="s_note" value=""></label>' +
    '<button class="btn sell block" data-act="simSellGo" data-code="' + code + '">確認賣出</button>');
}

/* ---------------- 掃描 ---------------- */
function doScan() {
  if (U.loading) { toast('正在掃描中，請稍等'); return; }
  U.loading = true;
  PROGRESS = '準備資料…';
  renderHeader();
  var btn = $('btnScan');
  if (btn) { btn.disabled = true; btn.textContent = '掃描中…'; }
  var codes = [];
  return D.fresh(false).then(function () {
    var snap = T.DCACHE.snapshot, chips = T.DCACHE.chips && T.DCACHE.chips.byCode;
    if (!snap || !chips) throw new Error('沒有行情資料');
    var cands = [];
    for (var code in snap.stocks) {
      if (!Object.prototype.hasOwnProperty.call(snap.stocks, code)) continue;
      if (!/^\d{4}$/.test(code) || /^00/.test(code)) continue;
      var s = snap.stocks[code];
      if (!isFinite(s.close) || s.close < 10) continue;
      if (!isFinite(s.vol) || s.vol / 1000 < S.cfg.scanMinLots) continue;
      var c = chips[code];
      if (!c) continue;
      var netVal = c.last * s.close;
      if (netVal < S.cfg.scanMinValue * 1e6) continue;
      cands.push({ code: code, netVal: netVal });
    }
    cands.sort(function (a, b) { return b.netVal - a.netVal; });
    codes = cands.slice(0, S.cfg.scanPool).map(function (x) { return x.code; });
    PROGRESS = '抓取 ' + codes.length + ' 檔歷史資料…'; renderHeader();
    return D.ensureHist(codes, function (done, total) {
      PROGRESS = '抓取歷史資料 ' + done + '/' + total + '…'; renderHeader();
    });
  }).then(function () {
    PROGRESS = '計算評分…'; renderHeader();
    var rows = [];
    codes.forEach(function (code) {
      var a = analysisFor(code);
      if (!a) return;
      var sc = ST.scoreOf(a), pl = ST.planOf(a, S.cfg), st = px(code);
      var per = D.perOf(code), rg = ST.regime();
      var snow = ST.snowflake(a, per, null, null);
      var nd = { analysis: a, per: per, rev: null, regime: rg, lotText: pl.lotText };
      var vd = ST.verdict(nd);
      var rs = ST.relStrength(a);
      rows.push({
        code: code, name: nameOf(code), ind: D.stockIndustry(code),
        close: a.close, pct: st ? st.pct : a.dayPct,
        score: vd.total, techScore: sc.score, grade: sc.grade,
        tags: sc.tags, warns: sc.warns,
        vlabel: vd.label, vtone: vd.tone,
        rs: rs ? rs.rating : null,
        stop: pl.stop, distPct: pl.distPct,
        snow: snow.axes.map(function (x) { return x.score === null ? -1 : x.score; }),
        snowNote: snow.axes.map(function (x) { return x.note; })
      });
    });
    rows.sort(function (a, b) { return b.score - a.score; });
    S.scan = { v: SCAN_V, at: Date.now(), day: T.DCACHE.day, rows: rows.slice(0, S.cfg.showN) };
    T.saveState();
    PROGRESS = '';
    U.loading = false;
    render();
    toast('掃描完成，' + S.scan.rows.length + ' 檔入選');
  }).catch(function (e) {
    U.loading = false; PROGRESS = '';
    U.lastError = String(e && e.message || e);
    render();
    toast('掃描失敗：' + U.lastError);
  });
}

/* ---------------- 事件 ---------------- */
function onClick(ev) {
  var t = ev.target.closest('[data-act]');
  if (!t) return;
  var act = t.getAttribute('data-act');
  var code = t.getAttribute('data-code');
  if (act === 'tab') setTab(t.getAttribute('data-tab'));
  else if (act === 'closeSheet') closeSheet();
  else if (act === 'bgClose') { if (ev.target === t) closeSheet(); }
  else if (act === 'detail') { U.code = code; U.news[code] = U.news[code] || null; openDetail(code); }
  else if (act === 'period') { U.period = t.getAttribute('data-p'); openDetail(U.code); }
  else if (act === 'scan') doScan();
  else if (act === 'refresh') refreshAll();
  else if (act === 'intlRefresh') { PROGRESS = '更新國際行情…'; renderHeader(); D.fetchIntl(true).then(function () { PROGRESS = ''; render(); }); }
  else if (act === 'addHoldSheet') addHoldSheet(null);
  else if (act === 'addHoldCode') addHoldSheet(code);
  else if (act === 'addWatchSheet') addWatchSheet(null);
  else if (act === 'addWatchCode') { addWatch(code, ''); }
  else if (act === 'addRecAll') { addRecAll(); }
  else if (act === 'saveHold') saveHold();
  else if (act === 'saveWatch') saveWatch();
  else if (act === 'delHold') { S.holdings = S.holdings.filter(function (x) { return x.code !== code; }); T.saveState(); render(); toast('已刪除持股紀錄'); }
  else if (act === 'simBuySheet') simBuySheet(code);
  else if (act === 'simSellSheet') sellSheet(code);
  else if (act === 'simSellNow') { sellSheet(code); }
  else if (act === 'simBuyGo') {
    var r = SIM.buy(code, val('s_shares'), val('s_price'), val('s_note'));
    if (!r.ok) toast(r.err); else { closeSheet(); render(); toast('模擬買進 ' + T.fmtMoney(r.amount) + '（含手續費 ' + T.fmt(r.fee, 0) + '）'); }
  }
  else if (act === 'simSellGo') {
    var r2 = SIM.sell(code, val('s_shares'), val('s_price'), val('s_note'));
    if (!r2.ok) toast(r2.err); else { closeSheet(); render(); toast('模擬賣出，損益 ' + T.fmtMoney(r2.pnl) + '（' + T.fmtPct(r2.pnlPct, 1) + '）'); }
  }
  else if (act === 'simReset') {
    if (confirm('確定重置模擬帳戶？所有模擬交易紀錄會清空（不影響真實持股）。')) {
      SIM.reset(S.cfg.simCapital, true); render(); toast('模擬帳戶已重置為 ' + T.fmtMoney(S.cfg.simCapital));
    }
  }
  else if (act === 'saveNote') {
    S.notes[code] = ($('note_' + code) || {}).value || '';
    T.saveState(); toast('筆記已儲存');
  }
  else if (act === 'newsRefresh') {
    U.news[code] = null; openDetail(code);
    D.fetchNews(code, true).then(function (n) { U.news[code] = n || []; openDetail(code); });
  }
  else if (act === 'heat') { heatSheet(t.getAttribute('data-ind')); }
  else if (act === 'saveCfg') saveCfg();
  else if (act === 'export') exportJSON();
  else if (act === 'import') importJSON();
}
function val(id) { var e = $(id); return e ? e.value.trim() : ''; }

function addWatch(code, reason) {
  if (!/^\d{4}$/.test(code)) { toast('請輸入 4 位數股票代號'); return; }
  if (S.watch.some(function (w) { return w.code === code; })) { toast('已經在觀察名單'); return; }
  S.watch.push({ code: code, reason: reason || '', addedAt: T.todayISO(0), src: 'manual' });
  T.saveState();
  D.histFor(code).then(function () { ANALYSIS = {}; render(); }).catch(function () { render(); });
  toast(nameOf(code) + ' 已加入觀察名單');
}
function addRecAll() {
  var scan = (S.scan && S.scan.v === SCAN_V) ? S.scan : null;
  if (!scan || !scan.rows.length) { toast('還沒有掃描結果'); return; }
  var n = 0;
  scan.rows.slice(0, 8).forEach(function (r) {
    if (S.watch.some(function (w) { return w.code === r.code; })) return;
    S.watch.push({ code: r.code, reason: r.vlabel + '（' + r.score + ' 分）', addedAt: T.todayISO(0), src: 'scan' });
    n++;
  });
  T.saveState();
  D.ensureHist(S.watch.map(function (w) { return w.code; })).then(function () { ANALYSIS = {}; render(); });
  toast(n ? '已加入 ' + n + ' 檔到觀察名單' : '推薦名單都已經在觀察名單裡了');
  closeSheet();
}
function saveHold() {
  var code = val('h_code'), cost = parseFloat(val('h_cost')), shares = parseInt(val('h_shares'), 10);
  var stop = parseFloat(val('h_stop'));
  if (!/^\d{4}$/.test(code)) { toast('請輸入 4 位數股票代號'); return; }
  if (!isFinite(cost) || cost <= 0) { toast('請輸入買進成本'); return; }
  if (!isFinite(shares) || shares <= 0) { toast('請輸入股數'); return; }
  S.holdings.push({ code: code, cost: cost, shares: shares, stopOverride: isFinite(stop) ? stop : null, addedAt: T.todayISO(0) });
  T.saveState();
  D.histFor(code).then(function () { ANALYSIS = {}; closeSheet(); render(); toast(nameOf(code) + ' 已加入持股'); });
}
function saveWatch() {
  addWatch(val('w_code'), val('w_reason'));
  closeSheet();
}
function heatSheet(ind) {
  var snap = T.DCACHE.snapshot;
  var rows = [];
  for (var code in snap.stocks) {
    if (!Object.prototype.hasOwnProperty.call(snap.stocks, code)) continue;
    if (!/^\d{4}$/.test(code) || /^00/.test(code)) continue;
    if (D.stockIndustry(code) !== ind) continue;
    var s = snap.stocks[code];
    rows.push({ code: code, name: s.name, close: s.close, pct: s.pct, value: s.value });
  }
  rows.sort(function (a, b) { return b.value - a.value; });
  $('modalRoot').innerHTML = sheetBody(ind + '（' + rows.length + ' 檔，依成交金額排序）',
    rows.slice(0, 25).map(function (r) {
      return '<div class="item" data-act="detail" data-code="' + r.code + '" style="padding:10px 0"><div class="l">' +
        '<div class="nm" style="font-size:14px">' + T.esc(r.name) + ' <span class="mut2 tiny">' + r.code + '</span></div>' +
        '<div class="cd">' + T.fmtMoney(r.value) + '</div></div><div class="r"><div class="px ' + toneCls(r.pct) + '">' + T.fmtPx(r.close) + '</div>' +
        '<div class="tiny ' + toneCls(r.pct) + '">' + T.fmtPct(r.pct) + '</div></div></div>';
    }).join(''));
}
function saveCfg() {
  var c = S.cfg;
  ['capital', 'riskPct', 'maxStopPct', 'atrK', 'scanMinLots', 'scanMinValue', 'scanPool', 'feeDiscount', 'simCapital'].forEach(function (k) {
    var v = parseFloat(val('cfg_' + k));
    if (isFinite(v)) c[k] = v;
  });
  c.stopMode = val('cfg_stopMode') || c.stopMode;
  c.intlEnabled = String(val('cfg_intlEnabled')) === '1';
  c.scanAny = String(val('cfg_scanAny')) === '1';
  c.finmindToken = val('cfg_finmindToken');
  T.saveState();
  ANALYSIS = {};
  render();
  toast('設定已儲存');
}
function exportJSON() {
  var data = JSON.stringify({ state: T.S, data: { names: T.DCACHE.names, per: T.DCACHE.per } });
  var blob = new Blob([data], { type: 'application/json' });
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = '台股助手備份-' + T.todayISO(0) + '.json';
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  toast('已匯出備份檔');
}
function importJSON() {
  var inp = document.createElement('input');
  inp.type = 'file'; inp.accept = '.json';
  inp.onchange = function () {
    var f = inp.files[0]; if (!f) return;
    var rd = new FileReader();
    rd.onload = function () {
      try {
        var j = JSON.parse(rd.result);
        if (j.state) {
          S.tab = j.state.tab || 'home'; S.cfg = j.state.cfg || S.cfg; S.holdings = j.state.holdings || [];
          S.watch = j.state.watch || []; S.scan = j.state.scan || null; S.sim = j.state.sim || SIM.ensure();
          S.notes = j.state.notes || {};
          T.saveState(); ANALYSIS = {}; render(); toast('備份已匯入');
        } else toast('檔案格式不對');
      } catch (e) { toast('匯入失敗：' + e.message); }
    };
    rd.readAsText(f);
  };
  inp.click();
}

/* ---------------- 初始載入 ---------------- */
function refreshAll(force) {
  PROGRESS = '載入市場資料…';
  renderHeader();
  T.onProgress = function (msg) { PROGRESS = msg; renderHeader(); };
  D.ensureNameMap().catch(function () {});
  D.fresh(force || false).then(function () {
    PROGRESS = '載入持股與觀察歷史資料…';
    renderHeader();
    var codes = S.holdings.map(function (h) { return h.code; }).concat(S.watch.map(function (w) { return w.code; }));
    if (codes.length) return D.ensureHist(codes, function (d, t2) { PROGRESS = '歷史資料 ' + d + '/' + t2 + '…'; renderHeader(); });
  }).then(function () {
    ANALYSIS = {};
    PROGRESS = '';
    render();
    if (S.cfg.intlEnabled && !T.DCACHE.intl) {
      D.fetchIntl().then(function () { render(); }).catch(function () {});
    }
  }).catch(function (e) {
    PROGRESS = '';
    render();
    toast('資料載入失敗：' + (e && e.message || e) + '（顯示為上次快取）');
  });
}

function boot() {
  document.addEventListener('click', onClick);
  var rb = $('btnRefresh');
  if (rb) rb.addEventListener('click', function () { refreshAll(true); });
  document.querySelectorAll('#tabs button').forEach(function (b) {
    b.classList.toggle('on', b.getAttribute('data-tab') === S.tab);
  });
  render();
  refreshAll(false);
}

window.UI = { render: render, openDetail: openDetail, doScan: doScan, refreshAll: refreshAll, toast: toast, boot: boot,
  analysisFor: analysisFor, histOf: histOf, chipOf: chipOf, nameOf: nameOf, addWatch: addWatch, saveHold: saveHold,
  get U() { return U; }, get PROGRESS() { return PROGRESS; }, get lastError() { return U.lastError; } };
if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
else boot();
})();

</script>
</body>
