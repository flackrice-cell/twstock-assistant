<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0e13">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="台股助手">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<title>台股決策助理</title>
<style>
:root{
  --bg:#0a0e13; --bg2:#0e141c;
  --card:rgba(20,28,38,.86); --card2:#18222f; --card3:#1e2937;
  --bd:rgba(255,255,255,.07); --bd2:rgba(255,255,255,.12);
  --fg:#e9eff6; --mut:#8b9cb0; --mut2:#64748b;
  --up:#ff5c5c; --up2:#ff8a7a; --dn:#22c58b; --dn2:#5fe0b0;
  --ac:#5aa9ff; --ac2:#8ec5ff; --warn:#ffb547; --vip:#c08cff;
  --shadow:0 8px 28px rgba(0,0,0,.34);
  --r:16px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--bg);color:var(--fg);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
  -webkit-text-size-adjust:100%;font-size:15px;line-height:1.55}
body{
  background:
    radial-gradient(1200px 480px at 15% -8%, rgba(90,169,255,.10), transparent 62%),
    radial-gradient(900px 420px at 105% 4%, rgba(192,140,255,.09), transparent 60%),
    linear-gradient(180deg,var(--bg2),var(--bg) 340px);
  background-attachment:fixed;
  padding-bottom:calc(74px + env(safe-area-inset-bottom));
  min-height:100vh;
}
h1,h2,h3,h4,p{margin:0;font-weight:700}
button,input,select,textarea{font-family:inherit;font-size:16px}
.up{color:var(--up)} .dn{color:var(--dn)} .mut{color:var(--mut)} .mut2{color:var(--mut2)}
.mono,.num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}
.tiny{font-size:11.5px} .sm{font-size:12.5px}
.center{text-align:center}
.hr{height:1px;background:var(--bd);margin:12px 0}

/* ---------- header ---------- */
#hdr{position:sticky;top:0;z-index:30;padding:calc(10px + env(safe-area-inset-top)) 14px 10px;
  background:linear-gradient(180deg, rgba(10,14,19,.97), rgba(10,14,19,.86) 70%, rgba(10,14,19,0));
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.hdr-top{display:flex;align-items:center;gap:10px}
.brand{display:flex;align-items:center;gap:9px}
.logo{width:32px;height:32px;border-radius:11px;background:linear-gradient(135deg,#ff5c5c,#c08cff 55%,#5aa9ff);
  box-shadow:0 4px 14px rgba(90,169,255,.28);display:flex;align-items:center;justify-content:center;font-size:16px}
.hdr-top h1{font-size:16px;letter-spacing:.3px;font-weight:800;line-height:1.2}
.hdr-top h1 span{font-weight:500;color:var(--mut2);font-size:10.5px;display:block;letter-spacing:.8px}
.iconbtn{width:42px;height:42px;border-radius:13px;background:var(--card);border:1px solid var(--bd);
  color:var(--fg);display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:17px;
  transition:transform .15s, background .15s}
.iconbtn:active{transform:scale(.94);background:var(--card2)}
.hdr-sub{display:flex;gap:6px;margin-top:9px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.hdr-sub::-webkit-scrollbar{display:none}
.chip{padding:4px 10px;border-radius:999px;border:1px solid var(--bd);background:var(--card);
  white-space:nowrap;font-size:11.5px;color:var(--mut);display:inline-flex;align-items:center;gap:5px}
.chip b{color:var(--fg);font-weight:700}
.chip.bull{color:var(--up);border-color:rgba(255,92,92,.4);background:rgba(255,92,92,.10)}
.chip.bear{color:var(--dn);border-color:rgba(34,197,139,.4);background:rgba(34,197,139,.10)}
.chip.warn{color:var(--warn);border-color:rgba(255,181,69,.4);background:rgba(255,181,69,.10)}
.chip.info{color:var(--ac);border-color:rgba(90,169,255,.35);background:rgba(90,169,255,.10)}

/* ---------- layout ---------- */
main{padding:6px 12px 20px;max-width:820px;margin:0 auto}
.card{background:var(--card);border:1px solid var(--bd);border-radius:var(--r);padding:14px;margin-bottom:10px;
  box-shadow:var(--shadow);backdrop-filter:blur(6px)}
.card.pad0{padding:0;overflow:hidden}
.card.glow{border-color:rgba(90,169,255,.25);box-shadow:0 8px 30px rgba(90,169,255,.10)}
.row{display:flex;align-items:center;gap:8px}
.row.wrap{flex-wrap:wrap}
.row.top{align-items:flex-start}
.sp{flex:1}
.sec{display:flex;align-items:center;gap:8px;margin:18px 4px 8px}
.sec h2{font-size:13.5px;letter-spacing:.6px;color:var(--mut);font-weight:700}
.sec .line{flex:1;height:1px;background:linear-gradient(90deg,var(--bd2),transparent)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.kv{background:var(--card2);border:1px solid var(--bd);border-radius:13px;padding:9px 10px}
.kv .k{font-size:11px;color:var(--mut2);display:flex;align-items:center;gap:4px}
.kv .v{font-size:15.5px;font-weight:700;margin-top:2px;letter-spacing:.2px}
.big{font-size:26px;font-weight:800;letter-spacing:-.4px}

/* ---------- items ---------- */
.item{display:flex;gap:10px;align-items:center;padding:12px 14px;border-bottom:1px solid var(--bd)}
.item:last-child{border-bottom:0}
.item:active{background:var(--card2)}
.item .l{flex:1;min-width:0}
.item .nm{font-weight:700;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .cd{font-size:11.5px;color:var(--mut2)}
.item .r{text-align:right;white-space:nowrap}
.item .px{font-weight:800;font-size:16px}
.pill{display:inline-block;font-size:11px;padding:2px 8px;border-radius:999px;border:1px solid var(--bd);
  color:var(--mut);margin:0 4px 4px 0;background:rgba(255,255,255,.03)}
.pill.buy{color:var(--up2);border-color:rgba(255,92,92,.36);background:rgba(255,92,92,.11)}
.pill.hold{color:var(--ac2);border-color:rgba(90,169,255,.34);background:rgba(90,169,255,.11)}
.pill.cut{color:var(--dn2);border-color:rgba(34,197,139,.36);background:rgba(34,197,139,.11)}
.pill.warnp{color:var(--warn);border-color:rgba(255,181,69,.38);background:rgba(255,181,69,.11)}
.pill.vip{color:var(--vip);border-color:rgba(192,140,255,.4);background:rgba(192,140,255,.12)}

/* ---------- buttons ---------- */
.btn{min-height:48px;padding:0 16px;border-radius:13px;border:1px solid var(--bd2);background:var(--card3);
  color:var(--fg);font-weight:700;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;
  gap:6px;transition:transform .14s,filter .14s}
.btn:active{transform:scale(.97)}
.btn.primary{background:linear-gradient(135deg,#5aa9ff,#7d7bff);border:0;color:#04111f;
  box-shadow:0 6px 20px rgba(90,169,255,.28)}
.btn.buy{background:linear-gradient(135deg,#ff5c5c,#ff8a5c);border:0;color:#210706;box-shadow:0 6px 20px rgba(255,92,92,.24)}
.btn.sell{background:linear-gradient(135deg,#22c58b,#5fe0b0);border:0;color:#032015;box-shadow:0 6px 20px rgba(34,197,139,.22)}
.btn.ghost{background:transparent}
.btn.danger{background:transparent;border-color:rgba(255,92,92,.5);color:var(--up2)}
.btn.sm{min-height:38px;font-size:13px;padding:0 12px;border-radius:11px}
.btn.block{width:100%}
.btn:disabled{opacity:.5}
input[type=text],input[type=number],input[type=password],select{width:100%;min-height:46px;background:var(--card2);
  color:var(--fg);border:1px solid var(--bd2);border-radius:12px;padding:0 12px;outline:none}
input:focus,select:focus{border-color:var(--ac)}
label.f{display:block;margin-bottom:11px}
label.f .lb{font-size:12.5px;color:var(--mut);margin-bottom:5px;display:block}

/* ---------- tabs ---------- */
#tabs{position:fixed;left:0;right:0;bottom:0;z-index:40;display:flex;
  background:rgba(10,14,19,.93);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  border-top:1px solid var(--bd);padding-bottom:env(safe-area-inset-bottom)}
#tabs button{flex:1;min-height:60px;background:none;border:0;color:var(--mut2);font-size:10.5px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;cursor:pointer;
  position:relative;transition:color .18s}
#tabs .ic{font-size:20px;line-height:1;transition:transform .18s}
#tabs button.on{color:var(--ac2)}
#tabs button.on .ic{transform:translateY(-1px) scale(1.06)}
#tabs button.on::before{content:"";position:absolute;top:0;left:50%;transform:translateX(-50%);width:26px;height:2.5px;
  border-radius:0 0 4px 4px;background:linear-gradient(90deg,#5aa9ff,#c08cff)}

/* ---------- misc ---------- */
.toast{position:fixed;left:50%;transform:translateX(-50%) translateY(10px);bottom:calc(84px + env(safe-area-inset-bottom));
  background:linear-gradient(135deg,#1e2937,#26364a);color:#fff;padding:11px 18px;border-radius:999px;font-size:13.5px;
  z-index:60;opacity:0;transition:opacity .25s, transform .25s;pointer-events:none;max-width:88%;
  border:1px solid var(--bd2);box-shadow:var(--shadow)}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.modal{position:fixed;inset:0;z-index:70;background:rgba(4,7,11,.66);display:flex;align-items:flex-end;
  animation:fade .2s ease}
@keyframes fade{from{opacity:0}to{opacity:1}}
.modal .sheet{background:linear-gradient(180deg,#131c27,#0d131b);width:100%;max-height:90vh;overflow:auto;
  border-radius:22px 22px 0 0;padding:16px 16px calc(24px + env(safe-area-inset-bottom));
  border-top:1px solid var(--bd2);animation:up .26s cubic-bezier(.22,.9,.3,1)}
@keyframes up{from{transform:translateY(24px)}to{transform:translateY(0)}}
.sheet h3{font-size:17px;font-weight:800}
@media(min-width:640px){.modal{align-items:center}.modal .sheet{max-width:560px;margin:0 auto;border-radius:20px}}
.bar{height:7px;border-radius:999px;background:rgba(255,255,255,.07);overflow:hidden}
.bar>i{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,#5aa9ff,#c08cff);transition:width .5s}
table.t{width:100%;border-collapse:collapse;font-size:13px}
table.t th,table.t td{padding:8px 6px;text-align:right;border-bottom:1px solid var(--bd);white-space:nowrap}
table.t th:first-child,table.t td:first-child{text-align:left}
table.t th{color:var(--mut2);font-weight:500;font-size:11.5px}
.note{font-size:12.5px;color:var(--mut);line-height:1.65}
.hint{background:rgba(90,169,255,.09);border:1px solid rgba(90,169,255,.24);border-radius:12px;padding:10px 12px;
  font-size:12.5px;color:#c6ddff;line-height:1.6}
.hint.warn{background:rgba(255,181,69,.09);border-color:rgba(255,181,69,.26);color:#ffe0b0}
.hint.bad{background:rgba(255,92,92,.09);border-color:rgba(255,92,92,.28);color:#ffc9c9}
.hint.ok{background:rgba(34,197,139,.09);border-color:rgba(34,197,139,.26);color:#bff3dd}
.empty{text-align:center;color:var(--mut2);padding:30px 14px;font-size:13.5px;line-height:1.7}
.loading{display:flex;align-items:center;gap:10px;color:var(--mut);font-size:13px;padding:10px 2px}
.spin{width:16px;height:16px;border:2px solid rgba(255,255,255,.15);border-top-color:var(--ac);border-radius:50%;
  animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.skel{background:linear-gradient(90deg,#18222f 25%,#22303f 37%,#18222f 63%);background-size:400% 100%;
  animation:sh 1.4s ease infinite;border-radius:10px;height:14px;margin:8px 0}
@keyframes sh{0%{background-position:100% 50%}100%{background-position:0 50%}}
details.dt{border:1px solid var(--bd);border-radius:14px;padding:11px 13px;background:rgba(24,34,47,.6);margin-bottom:9px}
details.dt>summary{cursor:pointer;font-size:13.5px;font-weight:700;list-style:none;display:flex;align-items:center;gap:7px}
details.dt>summary::-webkit-details-marker{display:none}
details.dt>summary::after{content:"＋";margin-left:auto;color:var(--mut2);font-weight:600}
details.dt[open]>summary::after{content:"－"}
.analyst{display:flex;gap:10px;align-items:flex-start;padding:11px 0;border-bottom:1px solid var(--bd)}
.analyst:last-child{border-bottom:0}
.avatar{width:38px;height:38px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:18px;
  background:var(--card2);border:1px solid var(--bd2);flex-shrink:0}
.verdict{font-size:20px;font-weight:800;letter-spacing:-.3px}
.news{padding:10px 0;border-bottom:1px solid var(--bd)}
.news:last-child{border-bottom:0}
.news a{color:var(--fg);text-decoration:none;font-size:13.5px;font-weight:600;line-height:1.5}
.news a:active{color:var(--ac2)}
.news .meta{font-size:11px;color:var(--mut2);margin-top:3px}
svg.chart{display:block;width:100%;height:auto}
svg.spark{display:block;width:100%;height:26px}
svg text.ct{font-size:9px;fill:var(--mut2);font-family:inherit;font-weight:500}
.lgd{display:flex;flex-wrap:wrap;gap:10px;margin:8px 0 0;font-size:11px;color:var(--mut)}
.lgd span{display:inline-flex;align-items:center;gap:5px}
.lgd i{width:9px;height:9px;border-radius:3px;display:inline-block}
.bullets{margin:6px 0 0;padding-left:17px;font-size:13px;color:#cfdae6;line-height:1.72}
.bullets li{margin-bottom:4px}
.bullets b{color:#fff}
.seg{display:flex;gap:4px;background:var(--card2);padding:4px;border-radius:12px;border:1px solid var(--bd)}
.seg button{flex:1;min-height:32px;border:0;background:transparent;color:var(--mut);border-radius:9px;
  font-size:12.5px;font-weight:700;padding:0 10px;cursor:pointer}
.seg button.on{background:var(--card3);color:var(--fg);box-shadow:0 2px 8px rgba(0,0,0,.28)}
.wall{display:flex;gap:7px;margin:9px 0 4px}
.wall .b{flex:1;text-align:center;border-radius:13px;padding:9px 4px;border:1px solid var(--bd);background:var(--card2)}
.wall .b b{display:block;font-size:19px;font-weight:800;line-height:1.2}
.wall .b span{font-size:10.5px;color:var(--mut2)}
.heat{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:6px}
.tile{border-radius:12px;padding:8px 9px;border:1px solid var(--bd);display:flex;flex-direction:column;gap:1px;cursor:pointer}
.tile:active{transform:scale(.97)}
.tile b{font-size:11.5px;font-weight:700;line-height:1.3}
.tile span{font-size:13.5px;font-weight:800;font-variant-numeric:tabular-nums}
.tile em{font-size:10px;color:var(--mut2);font-style:normal}
textarea{-webkit-appearance:none;font-family:inherit}
@media(max-width:520px){table.t.toCards thead{display:none}
  table.t.toCards tr{display:block;border:1px solid var(--bd);border-radius:12px;margin-bottom:8px;padding:7px 10px;background:rgba(24,34,47,.5)}
  table.t.toCards td{display:flex;justify-content:space-between;border:0;padding:5px 0;text-align:right}
  table.t.toCards td::before{content:attr(data-label);color:var(--mut2);font-size:12px;text-align:left;flex:1;margin-right:10px}}
</style>
</head>
<body>
<header id="hdr">
  <div class="hdr-top">
    <div class="brand"><div class="logo">📈</div>
      <h1>台股決策助理<span>股票分析 · 停損規劃 · 模擬練功</span></h1></div>
    <span class="sp"></span>
    <button class="iconbtn" id="btnRefresh" title="更新資料">⟳</button>
  </div>
  <div class="hdr-sub" id="hdrSub"><span class="chip">載入中…</span></div>
</header>
<main id="view"></main>
<nav id="tabs">
  <button data-tab="home" class="on"><span class="ic">◎</span>總覽</button>
  <button data-tab="hold"><span class="ic">▤</span>持股</button>
  <button data-tab="pick"><span class="ic">✦</span>選股</button>
  <button data-tab="sim"><span class="ic">🎯</span>模擬</button>
  <button data-tab="cfg"><span class="ic">⚙</span>設定</button>
</nav>
<div class="toast" id="toast"></div>
<div id="modalRoot"></div>
<script>
/* ============================================================
 * 01-core.js — 狀態、儲存、工具函式
 * ============================================================ */
'use strict';
(function () {

var LS_STATE = 'twstock.state.v1';
var LS_DATA  = 'twstock.data.v3';   // v3：新增國際盤勢、新聞、基本面（本益比）快取
var storageOK = true;

function lsGet(key, def) {
  try {
    var s = localStorage.getItem(key);
    if (!s) { localStorage.setItem(key + '.probe', '1'); return def; }
    return JSON.parse(s);
  } catch (e) { storageOK = false; return def; }
}
function lsSet(key, val) {
  try { localStorage.setItem(key, JSON.stringify(val)); return true; }
  catch (e) { storageOK = false; return false; }
}

/* ---------- 預設狀態 ---------- */
var DEFAULT_CFG = {
  capital: 1000000,     // 可投入資金（元）
  riskPct: 1,           // 單筆最大風險（% of 資金）
  stopMode: 'atr',      // atr | ma | pct
  atrK: 2,              // 停損 = 進場 - atrK × ATR
  maxStopPct: 10,       // 停損最大容忍幅度 %
  minLot: 1,            // 最小下單單位（股）：1=零股, 1000=整股
  scanMinLots: 2000,    // 選股：最小成交量（張）
  scanMinValue: 50,     // 選股：法人單日買超金額門檻（百萬元）
  scanPool: 30,         // 選股：進入技術面評分的檔數
  showN: 15,            // 選股：顯示前 N 名
  notify: false,
  simCapital: 1000000,  // 模擬帳戶初始資金
  feeDiscount: 0.6,     // 手續費折扣（電子下單常見 6 折）
  intlEnabled: true,    // 是否抓國際盤勢（經第三方代理）
  finmindToken: '',     // 選填：填了自己的 FinMind token 可提高額度
  watchAutoDays: 5      // 分析師推薦後建議觀察天數
};

var DEFAULT_SIM = {
  cash: 1000000, startCash: 1000000, startedAt: null,
  positions: [],        // {code, shares, cost, openedAt, stop, target, note}
  trades: []            // {date, code, side, price, shares, amount, note}
};

function loadState() {
  var s = lsGet(LS_STATE, null) || {};
  var cfg = Object.assign({}, DEFAULT_CFG, s.cfg || {});
  return {
    tab: s.tab || 'home',
    cfg: cfg,
    holdings: Array.isArray(s.holdings) ? s.holdings : [],
    watch: Array.isArray(s.watch) ? s.watch : [],
    scan: s.scan || null,
    sim: Object.assign({}, DEFAULT_SIM, s.sim || {}),
    notes: s.notes || {},
    lastOpen: s.lastOpen || null
  };
}
var S = loadState();
function saveState() {
  lsSet(LS_STATE, { tab: S.tab, cfg: S.cfg, holdings: S.holdings, watch: S.watch, scan: S.scan,
    sim: S.sim, notes: S.notes, lastOpen: S.lastOpen });
}
function saveData() {
  try {
    if (JSON.stringify(DCACHE).length > 3500000) {      // 保護 localStorage 上限
      DCACHE.hist = {};                                  // 丟掉最肥的部分，保留快照
    }
    lsSet(LS_DATA, DCACHE);
  } catch (e) { /* 忽略：資料快取失效不影響功能 */ }
}
var DCACHE = lsGet(LS_DATA, { market: null, snapshot: null, chips: null, hist: {}, day: null, at: 0 }) || {};
if (!DCACHE.hist) DCACHE.hist = {};

/* ---------- 小工具 ---------- */
function esc(s) {
  return String(s === undefined || s === null ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}
function num(s) {
  if (s === null || s === undefined) return NaN;
  var t = String(s).replace(/,/g, '').replace(/<[^>]*>/g, '').replace(/\s/g, '').replace(/\+/g, '');
  if (t === '' || t === '-') return NaN;
  return parseFloat(t);
}
function signStr(s) { return /<p[^>]*>\s*-|^-/.test(String(s)) ? '-' : ''; }

function fmt(n, d) {
  d = d === undefined ? 2 : d;
  if (!isFinite(n)) return '—';
  return n.toLocaleString('zh-TW', { minimumFractionDigits: d, maximumFractionDigits: d });
}
function fmtPx(n) { return isFinite(n) ? fmt(n, n < 100 ? 2 : 2) : '—'; }
function fmtPct(n, d) { d = d === undefined ? 2 : d; return isFinite(n) ? (n > 0 ? '+' : '') + fmt(n, d) + '%' : '—'; }
function fmtMoney(n) {
  if (!isFinite(n)) return '—';
  var a = Math.abs(n);
  if (a >= 1e8) return fmt(n / 1e8, 2) + '億';
  if (a >= 1e4) return fmt(n / 1e4, 1) + '萬';
  return fmt(n, 0);
}
function fmtLots(shares) { return fmt(shares / 1000, 0) + '張'; }
function cls(n) { return n > 0 ? 'up' : (n < 0 ? 'dn' : 'mut'); }
function todayISO(offsetDays) {
  var d = new Date(Date.now() + (offsetDays || 0) * 86400000);
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
}
function isoToROC(iso) {  // 2026-09-24 -> 20260924
  return iso.replace(/-/g, '');
}
function rocToISO(s) {   // 115/09/24 -> 2026-09-24
  var m = /^(\d{2,3})\/(\d{2})\/(\d{2})$/.exec(String(s).trim());
  if (!m) return null;
  return (parseInt(m[1], 10) + 1911) + '-' + m[2] + '-' + m[3];
}
function isWeekend(d) { var w = d.getDay(); return w === 0 || w === 6; }
function toast(msg, ms) {
  var el = document.getElementById('toast');
  el.textContent = msg; el.classList.add('on');
  clearTimeout(el._t); el._t = setTimeout(function () { el.classList.remove('on'); }, ms || 1900);
}
function sum(a) { var t = 0; for (var i = 0; i < a.length; i++) t += a[i]; return t; }

/* ---------- 網路 ---------- */
function getJSON(url, timeoutMs) {
  return new Promise(function (resolve, reject) {
    var ctl = ('AbortController' in window) ? new AbortController() : null;
    var timer = setTimeout(function () { if (ctl) ctl.abort(); }, timeoutMs || 25000);
    fetch(url, { cache: 'no-store', signal: ctl ? ctl.signal : undefined })
      .then(function (r) {
        if (!r.ok) throw new Error('HTTP ' + r.status);
        return r.json();
      })
      .then(function (j) { clearTimeout(timer); resolve(j); })
      .catch(function (e) { clearTimeout(timer); reject(e); });
  });
}
/* 同時最多 n 條連線 */
function pool(items, n, fn, onProgress) {
  var i = 0, done = 0, out = new Array(items.length), total = items.length;
  return new Promise(function (resolve) {
    if (!total) return resolve(out);
    var active = 0;
    function next() {
      if (i >= total) return;
      var idx = i++;
      active++;
      Promise.resolve()
        .then(function () { return fn(items[idx], idx); })
        .then(function (r) { out[idx] = r; })
        .catch(function (e) { out[idx] = { __err: String(e && e.message || e) }; })
        .then(function () {
          active--; done++;
          if (onProgress) onProgress(done, total);
          if (done >= total) resolve(out); else next();
        });
    }
    for (var k = 0; k < Math.min(n, total); k++) next();
  });
}

/* ---------------- FinMind 額度保護 ----------------
 * 免費額度用完時（status 402 / level 400）暫停 15 分鐘再試，
 * 並讓上層顯示友善訊息，而不是讓整頁掛掉。 */
var FM_LIMIT = { until: 0, msg: '' };
function fmPath(qs) {
  var t = T.S.cfg.finmindToken;
  return FINMIND + '?' + qs + (t ? '&token=' + encodeURIComponent(t) : '');
}
function fmFetch(url, timeout) {
  if (Date.now() < FM_LIMIT.until) return Promise.reject(new Error(FM_LIMIT.msg));
  return getJSON(url, timeout || 25000).then(function (j) {
    var msg = String((j && j.msg) || '');
    if (j && (j.status === 402 || (j.status === 400 && msg.indexOf('level') >= 0))) {
      FM_LIMIT.until = Date.now() + 15 * 60 * 1000;
      FM_LIMIT.msg = 'FinMind 免費額度暫時用完，約 15 分鐘後恢復（已用快取資料）';
      throw new Error(FM_LIMIT.msg);
    }
    return j;
  });
}
function fmLimited() { return Date.now() < FM_LIMIT.until; }

/* 純文字 GET（給 r.jina.ai 代理用） */
function getText(url, timeoutMs) {
  return new Promise(function (resolve, reject) {
    var ctl = ('AbortController' in window) ? new AbortController() : null;
    var timer = setTimeout(function () { if (ctl) ctl.abort(); }, timeoutMs || 22000);

}

/* ---------------- 交易日 ----------------
 * 往回找最近一個「有資料」的交易日（自動跨過週末與國定假日）。 */
function probeTradingDay() {
  var d = new Date();
  var tries = 0;
  return new Promise(function (resolve, reject) {
    (function step() {
      if (tries++ > 12) return reject(new Error('找不到最近的交易日資料'));
      var iso = d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
      var wd = d.getDay();
      if (wd === 0 || wd === 6) { d.setDate(d.getDate() - 1); return step(); }
      getJSON(TWSE + 'afterTrading/MI_INDEX?date=' + T.isoToROC(iso) + '&type=ALLBUT0999&response=json', 20000)
        .then(function (j) {
          if (j && j.stat === 'OK' && findQuoteTable(j)) return resolve(iso);
          d.setDate(d.getDate() - 1); step();
        })
        .catch(function () { d.setDate(d.getDate() - 1); step(); });
    })();
  });
}
function findQuoteTable(j) {
  var t = j && j.tables;
  if (!t) return null;
  for (var i = 0; i < t.length; i++) {
    var f = t[i] && t[i].fields;
    if (f && f.indexOf('證券代號') >= 0 && f.indexOf('收盤價') >= 0 && t[i].data && t[i].data.length) {
      // 跳過權證等非股票表：以第一列代號是否 4 碼數字判斷
      if (/^\d{4}/.test(String(t[i].data[0][0]))) return t[i];
    }
  }
  return null;
}

/* ---------------- 全市場當日行情（上市，一次抓全部） ---------------- */
function fetchSnapshot(iso) {
  return getJSON(TWSE + 'afterTrading/MI_INDEX?date=' + T.isoToROC(iso) + '&type=ALLBUT0999&response=json', 30000)
    .then(function (j) {
      var qt = findQuoteTable(j);
      if (!qt) throw new Error('無行情表');
      var idx = { name: '發行量加權股價指數', close: NaN, change: NaN, pct: NaN };
      var t0 = (j.tables || [])[0];
      if (t0) {
        for (var r = 0; r < t0.data.length; r++) {
          if (String(t0.data[r][0]).indexOf('發行量加權股價指數') >= 0) {
            idx.close = T.num(t0.data[r][1]);
            idx.change = (T.signStr(t0.data[r][2]) === '-' ? -1 : 1) * T.num(t0.data[r][3]);
            idx.pct = T.num(t0.data[r][4]);
            break;
          }
        }
      }
      var breadth = { up: 0, down: 0, flat: 0 };
      for (var k = 0; k < (j.tables || []).length; k++) {
        if ((j.tables[k].fields || []).indexOf('類型') >= 0) {
          (j.tables[k].data || []).forEach(function (row) {
            var label = String(row[0]);
            var stock = String(row[2] || '');
            var m = /^([\d,]+)/.exec(stock.replace(/\(.*\)/, ''));
            var v = m ? T.num(m[1]) : 0;
            if (label.indexOf('上漲') === 0) breadth.up = v;
            else if (label.indexOf('下跌') === 0) breadth.down = v;
            else if (label.indexOf('持平') === 0) breadth.flat = v;
          });
        }
      }
      var H = qt.fields, ix = {};
      H.forEach(function (f, i) { ix[f.trim()] = i; });
      var stocks = {};
      qt.data.forEach(function (row) {
        var code = String(row[ix['證券代號']] || '').trim();
        if (!/^\d{4}[A-Z]?$/.test(code)) return;              // 只留個股/ETF（4 碼），排除權證
        var close = T.num(row[ix['收盤價']]);
        if (!isFinite(close)) return;
        var chg = (T.signStr(row[ix['漲跌(+/-)']]) === '-' ? -1 : 1) * T.num(row[ix['漲跌價差']]);
        if (!isFinite(chg)) chg = 0;
        var prev = close - chg;
        stocks[code] = {
          code: code,
          name: String(row[ix['證券名稱']] || '').trim(),
          close: close, open: T.num(row[ix['開盤價']]), high: T.num(row[ix['最高價']]),
          low: T.num(row[ix['最低價']]),
          vol: T.num(row[ix['成交股數']]), value: T.num(row[ix['成交金額']]),
          change: chg, pct: prev > 0 ? chg / prev * 100 : 0,
          pe: T.num(row[ix['本益比']])
        };
      });
      return { date: iso, index: idx, breadth: breadth, stocks: stocks };
    });
}

/* ---------------- 三大法人（每日一次，全市場） ---------------- */
function parseT86(j) {
  var H = j.fields || [], ix = {};
  H.forEach(function (f, i) { ix[f] = i; });
  var ci = 0, ni = 1;
  var fBuy = -1, tBuy = -1, dBuy = -1;
  H.forEach(function (f, i) {
    if (f.indexOf('外陸資買賣超股數') === 0) fBuy = i;
    if (f.indexOf('投信買賣超股數') === 0) tBuy = i;
    if (f.indexOf('自營商買賣超股數') === 0) dBuy = i;
  });
  var out = {};
  (j.data || []).forEach(function (row) {
    var code = String(row[ci] || '').trim();
    if (!/^\d{4}[A-Z]?$/.test(code)) return;
    out[code] = {
      name: String(row[ni] || '').trim(),
      f: T.num(row[fBuy]) || 0,   // 外資及陸資（股）
      t: T.num(row[tBuy]) || 0,   // 投信（股）
      d: T.num(row[dBuy]) || 0    // 自營商（股）
    };
  });
  return out;
}
function fetchChips(anchorISO, nDays) {
  nDays = nDays || 5;
  var d = new Date(anchorISO + 'T00:00:00');
  var days = [], probes = 0;
  return new Promise(function (resolve) {
    (function step() {
      if (days.length >= nDays || probes > 22) return resolve(days);
      probes++;
      var wd = d.getDay();
      if (wd === 0 || wd === 6) { d.setDate(d.getDate() - 1); return step(); }
      var iso = d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
      getJSON(TWSE + 'fund/T86?date=' + T.isoToROC(iso) + '&selectType=ALLBUT0999&response=json', 25000)
        .then(function (j) {
          if (j && j.stat === 'OK' && j.data && j.data.length) days.push({ date: iso, map: parseT86(j) });
          d.setDate(d.getDate() - 1); step();
        })
        .catch(function () { d.setDate(d.getDate() - 1); step(); });
    })();
  });
}
function aggregateChips(days) {
  var agg = {}, dates = days.map(function (x) { return x.date; });
  for (var i = days.length - 1; i >= 0; i--) {          // 由舊到新
    var map = days[i].map;
    for (var code in map) {
      if (!Object.prototype.hasOwnProperty.call(map, code)) continue;
      var v = map[code];
      var a = agg[code] || (agg[code] = { f: 0, t: 0, d: 0, seq: [], seqF: [], seqT: [], name: v.name });
      a.f += v.f; a.t += v.t; a.d += v.d;
      a.seq.push(v.f + v.t);                               // 舊 → 新（合計）
      a.seqF.push(v.f);
      a.seqT.push(v.t);
    }
  }
  var out = {};
  for (var c in agg) {
    if (!Object.prototype.hasOwnProperty.call(agg, c)) continue;
    var a = agg[c];
    var streak = 0;
    for (var k = a.seq.length - 1; k >= 0; k--) {
      if (a.seq[k] > 0) streak++; else break;
    }
    var negStreak = 0;
    for (var k2 = a.seq.length - 1; k2 >= 0; k2--) {
      if (a.seq[k2] < 0) negStreak++; else break;
    }
    out[c] = {
      name: a.name,
      f5: a.f, t5: a.t, d5: a.d, i5: a.f + a.t,
      f1: a.seqF.length ? a.seqF[a.seqF.length - 1] : 0,   // 最近一日外資
      t1: a.seqT.length ? a.seqT[a.seqT.length - 1] : 0,   // 最近一日投信
      last: a.seq.length ? a.seq[a.seq.length - 1] : 0,
      streak: streak, negStreak: negStreak, days: a.seq.length, seq: a.seq
    };
  }
  return { byCode: out, dates: dates };
}

/* ---------------- 大盤指數歷史（每月一次） ---------------- */
function fetchIndexSeries(months) {
  months = months || 6;
  var d = new Date(), list = [];
  for (var i = 0; i < months; i++) {
    list.push(d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-01');
    d.setMonth(d.getMonth() - 1);
  }
  return pool(list, 3, function (m) {
    return getJSON(TWSE + 'afterTrading/FMTQIK?date=' + T.isoToROC(m) + '&response=json', 25000)
      .then(function (j) {
        if (!j || j.stat !== 'OK' || !j.data) return [];
        var out = [];
        j.data.forEach(function (row) {
          var iso = T.rocToISO(row[0]);
          var close = T.num(row[4]);
          if (iso && isFinite(close)) out.push([iso, close, T.num(row[2])]);
        });
        return out;
      })
      .catch(function () { return []; });
  }).then(function (parts) {
    var all = [];
    parts.forEach(function (p) { if (Array.isArray(p)) all = all.concat(p); });
    var seen = {};
    all = all.filter(function (r) { if (seen[r[0]]) return false; seen[r[0]] = 1; return true; })
             .sort(function (a, b) { return a[0] < b[0] ? -1 : 1; });
    return all;
  });
}

/* ---------------- 個股歷史日 K ----------------
 * 主要：FinMind（上市＋上櫃，一次抓整段）
 * 備援：證交所 STOCK_DAY（限上市，逐月抓） */
function fetchHistFinmind(code, days) {

  var url = fmPath('dataset=TaiwanStockPrice&data_id=' + encodeURIComponent(code) +
            '&start_date=' + start);
  return fmFetch(url, 25000).then(function (j) {
    if (!j || j.status !== 200 || !Array.isArray(j.data) || !j.data.length) {
      throw new Error((j && j.msg) ? j.msg : 'FinMind 無資料');
    }

    j.data.forEach(function (r) {
      var c = +r.close;
      if (!isFinite(c) || c <= 0) return;
      rows.push([r.date, +r.open, +r.max, +r.min, c, +r.Trading_Volume]);
    });
    rows.sort(function (a, b) { return a[0] < b[0] ? -1 : 1; });

    return rows;
  });
}
function fetchHistTWSE(code, months) {
  months = months || 6;

  for (var i = 0; i < months; i++) {
    list.push(d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-01');

function fetchHist(code) {

/* ---------------- 名稱／產業（全市場清單，一天一次） ---------------- */
function ensureNameMap() {
  if (DCACHE.names && DCACHE.namesDay === DCACHE.day) return Promise.resolve(DCACHE.names);
  /* 產業別幾乎不會變動：一旦抓到就保留 30 天，
     這樣 FinMind 免費額度用完時，「類股輪動」與「漲跌歸因」也不會整組失效 */
  if (hasIndustry() && DCACHE.namesAt && (Date.now() - DCACHE.namesAt) < 30 * 86400000) {
    return Promise.resolve(DCACHE.names);
  }
  return fmFetch(fmPath('dataset=TaiwanStockInfo'), 30000).then(function (j) {
    var map = {};
    (j.data || []).forEach(function (r) {
      if (!map[r.stock_id]) {
        map[r.stock_id] = { name: r.stock_name, type: r.type, ind: r.industry_category };
      }
    });
    DCACHE.names = map; DCACHE.namesDay = DCACHE.day; DCACHE.namesAt = Date.now();
    T.saveData();
    return map;
  }).catch(function () { return DCACHE.names || {}; });
}
function hasIndustry() {
  var n = DCACHE.names;
  if (!n) return false;
  var c = 0;
  for (var k in n) { if (Object.prototype.hasOwnProperty.call(n, k) && n[k].ind) { c++; if (c > 50) return true; } }
  return false;
}
function stockName(code) {
  var s = DCACHE.snapshot && DCACHE.snapshot.stocks && DCACHE.snapshot.stocks[code];
  if (s && s.name) return s.name;
  var n = DCACHE.names && DCACHE.names[code];
  return n ? n.name : '';
}
function marketType(code) {
  var n = DCACHE.names && DCACHE.names[code];
  if (n && n.type) return n.type === 'tpex' ? '上櫃' : '上市';
  return '上市';
}

/* ---------------- 對外：一次抓齊每日資料 ---------------- */
function fresh(force) {
  if (!force && DCACHE.at && (Date.now() - DCACHE.at) < 30 * 60 * 1000 && DCACHE.snapshot && DCACHE.chips) {
    return Promise.resolve(true);
  }
  var prog = function (msg) { if (T.onProgress) T.onProgress(msg); };
  var dayIso;
  prog('查詢最近交易日…');
  return probeTradingDay().then(function (iso) {
    dayIso = iso;
    prog('抓取每日收盤行情…');
    return fetchSnapshot(iso);
  }).then(function (snap) {
    DCACHE.snapshot = snap;
    DCACHE.day = dayIso;
    prog('抓取三大法人買賣超（10 個交易日）…');
    return fetchChips(dayIso, 10);
  }).then(function (days) {
    DCACHE.chips = aggregateChips(days);
    prog('抓取大盤指數歷史（近一年）…');
    return fetchIndexSeries(13);
  }).then(function (series) {
    DCACHE.series = series;
    DCACHE.at = Date.now();
    var s = series.map(function (r) { return r[1]; });
    var t = series.map(function (r) { return r[2]; });
    DCACHE.market = {
      date: series.length ? series[series.length - 1][0] : null,
      close: s.length ? s[s.length - 1] : NaN,
      ma5: SMA(s, 5), ma20: SMA(s, 20), ma60: SMA(s, 60),
      ma20Slope: slopePct(s, 20, 5),
      turnover: t.length ? t[t.length - 1] : NaN,
      avgTurnover20: SMA(t.slice(0, -1), 20),
      volR: (function () { var a = SMA(t.slice(0, -1), 20); return a > 0 ? t[t.length - 1] / a : NaN; })()
    };
    T.saveData();
    prog('抓取本益比／殖利率…');
    return fetchPER(dayIso).catch(function () { return null; });
  }).then(function (per) {
    if (per) DCACHE.per = per;
    T.saveData();
    return true;
  });
}
function SMA(arr, n) {
  if (!arr || arr.length < n) return NaN;
  var s = arr.slice(-n);
  var t = 0;
  for (var i = 0; i < s.length; i++) t += s[i];
  return t / n;
}
function slopePct(arr, maLen, lookback) {
  if (arr.length < maLen + lookback) return NaN;
  var a = SMA(arr.slice(0, arr.length - lookback), maLen);
  var b = SMA(arr, maLen);
  return a > 0 ? (b - a) / a * 100 : NaN;
}

/* ---------------- 對外：個股日 K（含快取） ---------------- */
function histFor(code, force) {
  var c = DCACHE.hist[code];
  if (!force && c && c.rows && c.rows.length && c.d === DCACHE.day) return Promise.resolve(c.rows);
  var full = isPinned(code);

  var unit = cfg.minLot === 1000 ? 1000 : 1;

  if (invert) return score >= 70 ? '風險可控' : score >= 45 ? '注意風險' : '風險偏高';
  return score >= 65 ? '偏多' : score >= 45 ? '中性' : '偏空';
}

/* ---------------- 綜合結論 ---------------- */
function verdict(ctx) {
  var a = ctx.analysis, chip = a.chip;
  var tech = clamp100(50 + (a.close > a.ma20 ? 12 : -12) + (a.ma20 > a.ma60 ? 10 : -10) + (a.ma20Up ? 6 : -6) +
    (a.osc > 0 ? 8 : -8) + (a.k > a.d ? 6 : -6) + (a.r20 > 5 ? 8 : a.r20 < -5 ? -8 : 0));
  var chipS = 50;
  if (chip) {
    chipS = clamp100(50 + (chip.streak >= 3 ? 22 : chip.streak * 6) - (chip.negStreak >= 3 ? 22 : chip.negStreak * 6) +
      (a.close * chip.i5 > 1e8 ? 12 : a.close * chip.i5 < -1e8 ? -12 : 0));
  }
  var fundS = 50;
  if (ctx.per && isFinite(ctx.per.pe) && ctx.per.pe > 0) {
    var mp = medianPE();
    if (mp) fundS += ctx.per.pe < mp ? 15 : -10;
    if (isFinite(ctx.per.yld) && ctx.per.yld >= 4) fundS += 10;
  }
  if (ctx.rev && isFinite(ctx.rev.yoy)) fundS += ctx.rev.yoy >= 20 ? 18 : ctx.rev.yoy >= 5 ? 10 : ctx.rev.yoy >= 0 ? 3 : -14;
  fundS = clamp100(fundS);
  var risk = clamp100(70 - Math.abs(a.bias20) * 1.6 - (a.atrPct > 4 ? 12 : 0) - (a.volR < 0.7 ? 12 : 0) -
    (a.fromHi60 > -3 ? 6 : 0) - (a.gapWarn ? 8 : 0));
  var total = Math.round(tech * 0.3 + chipS * 0.2 + fundS * 0.2 + risk * 0.3);
  /* 大盤逆風時整體下調，避免在空頭市場還給出「值得布局」 */
  if (ctx.regime && ctx.regime.tone === 'bear') total = Math.round(total * 0.85);

  var level, label, tone;
  if (total >= 72) { level = 'buy'; label = '值得分批布局'; tone = 'up'; }
  else if (total >= 60) { level = 'watch'; label = '可以先觀察，等回測再進'; tone = 'ac'; }
  else if (total >= 45) { level = 'neutral'; label = '條件普通，不急著買'; tone = 'mut'; }
  else { level = 'avoid'; label = '暫時不建議進場'; tone = 'dn'; }

  var why = [], how = [], riskList = [];
  var pl = ST.planOf(a, T.S.cfg);
  why.push('技術面：' + (a.close > a.ma20 && a.ma20 > a.ma60 ? '均線多頭排列，趨勢站在買方' :
    a.close > a.ma20 ? '站上月線，但季線還沒翻正' : '跌破月線，短線偏弱') + '（' + tech + ' 分）。');
  why.push('籌碼面：' + (chip ? (chip.streak >= 2 ? '法人連續 ' + chip.streak + ' 日買超' :
    chip.negStreak >= 2 ? '法人連續 ' + chip.negStreak + ' 日賣超' : '法人買賣超不明顯') : '無法人資料') + '（' + chipS + ' 分）。');
  why.push('基本面：' + (ctx.rev && isFinite(ctx.rev.yoy) ? '月營收年增 ' + T.fmtPct(ctx.rev.yoy) : '月營收未取得') +
    (ctx.per && isFinite(ctx.per.pe) ? '、本益比 ' + T.fmt(ctx.per.pe, 1) + ' 倍' : '') + '（' + fundS + ' 分）。');
  why.push('風險：' + (risk >= 65 ? '波動與乖離都在可接受範圍' : '短線偏熱或量能不足') + '（' + risk + ' 分）。');

  how.push('想買的話，進場參考價 ' + T.fmtPx(pl.entry) + '（或等回到月線 ' + T.fmtPx(pl.pullback) + ' 附近）。');
  how.push('停損設 ' + T.fmtPx(pl.stop) + '（- ' + T.fmt(pl.distPct, 1) + '%），跌破就先出場。');
  how.push('用 ' + T.fmtMoney(T.S.cfg.capital) + ' 的資金、單筆風險 ' + T.fmt(T.S.cfg.riskPct, 1) + '%，建議買 ' + st10(ctx.lotText || '—') + '。');
  how.push('目標先看 ' + T.fmtPx(pl.t1) + '（1:2 風報比），抱住的話沿月線往上移動停損。');

  riskList.push('買進後跌破 ' + T.fmtPx(pl.stop) + '：代表原本的判斷錯了，出場不要凹。');
  riskList.push('月營收由成長轉為衰退、或法人由買轉賣：基本面／籌碼條件消失。');
  riskList.push('大盤跌破季線：就算個股再好，也要降低部位。');
  return { total: total, level: level, label: label, tone: tone, parts: { tech: tech, chip: chipS, fund: fundS, risk: risk },
           why: why, how: how, risk: riskList };
}
function st10(s) { return s; }
function clamp100(x) { return Math.max(0, Math.min(100, Math.round(x))); }

/* ---------------- 漲跌原因歸因 ---------------- */
function attribution(a, newsSent) {
  var snap = T.DCACHE.snapshot, market = (snap && snap.index) ? snap.index.pct : NaN;
  var ind = D.industryOf(a.code);
  var indPct = ind ? ind.avgPct : NaN;
  var mine = a.dayPct;
  var tags = [], text = '';
  var vsMkt = isFinite(market) ? mine - market : NaN;
  var vsInd = isFinite(indPct) ? mine - indPct : NaN;
  if (isFinite(vsInd) && Math.abs(vsInd) >= 1.2) {
    text = vsInd > 0
      ? '今天明顯強於同類股（類股平均 ' + T.fmtPct(indPct) + '），屬於個股自己的題材或買盤。'
      : '今天明顯弱於同類股（類股平均 ' + T.fmtPct(indPct) + '），可能有個股利空或賣壓。';
    tags.push(vsInd > 0 ? '強於類股' : '弱於類股');
  } else if (isFinite(vsMkt) && Math.abs(vsMkt) >= 1.2) {
    text = vsMkt > 0 ? '主要跟著大盤走，但比大盤強一點。' : '主要跟著大盤走，但比大盤弱一點。';
    tags.push('跟隨大盤');
  } else if (isFinite(indPct) && Math.abs(indPct - market) >= 0.8) {
    text = (indPct > market ? '類股輪動帶動' : '類股拖累') + '：' + (D.stockIndustry(a.code) || '所屬類股') +
      '今天平均 ' + T.fmtPct(indPct) + '，大盤 ' + T.fmtPct(market) + '。';
    tags.push(indPct > market ? '類股走強' : '類股走弱');
  } else {
    text = '和大盤、類股差不多同步，沒有明顯的個別因素。';
    tags.push('同步大盤');
  }
  if (a.volR >= 1.5) { tags.push('成交量放大 ' + T.fmt(a.volR, 1) + ' 倍'); }
  else if (a.volR < 0.7) { tags.push('成交量萎縮'); }
  if (a.chip) {
    if (a.chip.last > 0) tags.push('法人當日買超');
    else if (a.chip.last < 0) tags.push('法人當日賣超');
  }
  if (newsSent) tags.push(newsSent.label);
  return { text: text, tags: tags, vsMarket: vsMkt, vsIndustry: vsInd, market: market, industry: indPct, industryName: D.stockIndustry(a.code) };
}

window.STRAT.newsSentiment = newsSentiment;

/* ============================================================
 * 04-sim.js — 模擬交易（紙上交易）引擎
 * 以當日收盤價成交，含手續費與證交稅，可與大盤績效對照。
 * ============================================================ */
'use strict';
(function () {
var T = window.T;

var FEE_RATE = 0.001425;   // 券商手續費牌告 0.1425%
var FEE_MIN = 20;          // 最低手續費 20 元
var TAX_RATE = 0.003;      // 賣出證交稅 0.3%

function feeOf(amount) {
  var d = T.S.cfg.feeDiscount || 1;
  return Math.max(FEE_MIN, Math.round(amount * FEE_RATE * d));
}
function taxOf(amount) { return Math.round(amount * TAX_RATE); }

function priceOf(code) {
  var snap = T.DCACHE.snapshot && T.DCACHE.snapshot.stocks && T.DCACHE.snapshot.stocks[code];
  if (snap && isFinite(snap.close)) return snap.close;
  var h = T.DCACHE.hist && T.DCACHE.hist[code];
  if (h && h.rows && h.rows.length) return h.rows[h.rows.length - 1][4];
  return NaN;
}
function priceDate() { return T.DCACHE.day || T.todayISO(0); }

function reset(capital, force) {
  var sim = T.S.sim;
  if (!force && sim.trades && sim.trades.length) return false;
  var cap = capital || T.S.cfg.simCapital || 1000000;
  T.S.sim = { cash: cap, startCash: cap, startedAt: priceDate(), positions: [], trades: [] };
  T.saveState();
  return true;
}
function ensure() {
  var sim = T.S.sim;
  if (!sim || !isFinite(sim.startCash)) reset(null, true);
  if (!T.S.sim.startedAt) { T.S.sim.startedAt = priceDate(); T.saveState(); }
  return T.S.sim;
}

/* 買進（模擬）：價格未指定時用最新收盤價 */
function buy(code, shares, price, note) {
  var sim = ensure();
  shares = Math.floor(shares || 0);
  if (!code || shares <= 0) return { ok: false, err: '請輸入股數' };
  var px = price || priceOf(code);
  if (!isFinite(px) || px <= 0) return { ok: false, err: '查不到成交價' };
  var amount = px * shares;
  var fee = feeOf(amount);
  var need = Math.round(amount) + fee;
  if (need > sim.cash) return { ok: false, err: '現金不足（需要 ' + T.fmtMoney(need) + '，可用 ' + T.fmtMoney(sim.cash) + '）' };
  var pos = null;
  for (var i = 0; i < sim.positions.length; i++) if (sim.positions[i].code === code) pos = sim.positions[i];
  if (pos) {
    var newShares = pos.shares + shares;
    pos.cost = (pos.cost * pos.shares + amount + fee) / newShares;
    pos.shares = newShares;
  } else {
    sim.positions.push({
      code: code, shares: shares, cost: (amount + fee) / shares,
      openedAt: priceDate(), stop: null, target: null, note: note || ''
    });
  }
  sim.cash = sim.cash - need;
  sim.trades.unshift({ date: priceDate(), code: code, side: 'buy', price: px, shares: shares,
    amount: Math.round(amount), fee: fee, tax: 0, pnl: null, note: note || '' });
  T.saveState();
  return { ok: true, price: px, amount: Math.round(amount), fee: fee, cash: sim.cash };
}

/* 賣出（模擬） */
function sell(code, shares, price, note) {
  var sim = ensure();
  var pos = null, idx = -1;
  for (var i = 0; i < sim.positions.length; i++) if (sim.positions[i].code === code) { pos = sim.positions[i]; idx = i; }
  if (!pos) return { ok: false, err: '沒有這檔的模擬持股' };
  shares = Math.floor(shares || pos.shares);
  if (shares <= 0) return { ok: false, err: '請輸入股數' };
  if (shares > pos.shares) shares = pos.shares;
  var px = price || priceOf(code);
  if (!isFinite(px) || px <= 0) return { ok: false, err: '查不到成交價' };
  var amount = px * shares;
  var fee = feeOf(amount), tax = taxOf(amount);
  var proceeds = Math.round(amount) - fee - tax;
  var costBasis = pos.cost * shares;
  var pnl = proceeds - costBasis;
  var pnlPct = costBasis > 0 ? pnl / costBasis * 100 : 0;
  sim.cash += proceeds;
  if (shares >= pos.shares) sim.positions.splice(idx, 1);
  else { pos.shares -= shares; }
  sim.trades.unshift({ date: priceDate(), code: code, side: 'sell', price: px, shares: shares,
    amount: Math.round(amount), fee: fee, tax: tax, pnl: Math.round(pnl), pnlPct: pnlPct, note: note || '' });
  T.saveState();
  return { ok: true, price: px, proceeds: proceeds, pnl: Math.round(pnl), pnlPct: pnlPct, cash: sim.cash };
}

/* 更新持股的停損／目標（依目前設定重算） */
function setPlan(code, stop, target) {
  var sim = ensure();
  for (var i = 0; i < sim.positions.length; i++) {
    if (sim.positions[i].code === code) {
      if (isFinite(stop)) sim.positions[i].stop = stop;
      if (isFinite(target)) sim.positions[i].target = target;
    }
  }
  T.saveState();
}

/* 帳戶狀態 */
function stats(benchStartDate) {
  var sim = ensure();
  var mv = 0, rows = [];
  sim.positions.forEach(function (p) {
    var px = priceOf(p.code);
    var val = isFinite(px) ? px * p.shares : 0;
    mv += val;
    var pnl = isFinite(px) ? (px - p.cost) * p.shares : NaN;
    rows.push({
      code: p.code, shares: p.shares, cost: p.cost, price: px, value: val,
      pnl: pnl, pnlPct: p.cost > 0 ? (px - p.cost) / p.cost * 100 : NaN,
      stop: p.stop, target: p.target, openedAt: p.openedAt, note: p.note
    });
  });
  var total = sim.cash + mv;
  var pnl = total - sim.startCash;
  var closed = sim.trades.filter(function (t) { return t.side === 'sell' && isFinite(t.pnl); });
  var wins = closed.filter(function (t) { return t.pnl > 0; }).length;
  return {
    cash: sim.cash, marketValue: mv, total: total, startCash: sim.startCash,
    pnl: pnl, pnlPct: sim.startCash > 0 ? pnl / sim.startCash * 100 : 0,
    positions: rows, trades: sim.trades, startedAt: sim.startedAt,
    closedCount: closed.length, winRate: closed.length ? wins / closed.length * 100 : NaN,
    realized: closed.reduce(function (s, t) { return s + t.pnl; }, 0),
    fees: sim.trades.reduce(function (s, t) { return s + (t.fee || 0) + (t.tax || 0); }, 0),
    benchPct: benchSince(benchStartDate || sim.startedAt)
  };
}
/* 同期大盤報酬（用已抓到的指數歷史） */
function benchSince(iso) {
  var s = T.DCACHE.series || [];
  if (!s.length || !iso) return NaN;
  var start = null, end = s[s.length - 1][1];
  for (var i = 0; i < s.length; i++) { if (s[i][0] >= iso) { start = s[i][1]; break; } }
  if (start === null) start = s[0][1];
  return start > 0 ? (end - start) / start * 100 : NaN;
}

window.SIM = {
  reset: reset, ensure: ensure, buy: buy, sell: sell, setPlan: setPlan,
  stats: stats, priceOf: priceOf, priceDate: priceDate, feeOf: feeOf, taxOf: taxOf
};
})();

/* ============================================================
 * 05-chart.js — 純 SVG 圖表（不依賴任何外部函式庫）
 * K 線、五力雷達（雪花圖）、技術評分儀表、走勢線、類股熱力圖、RS 線
 * ============================================================ */
'use strict';
(function () {
var C_UP = '#ff5b5b', C_DN = '#22c58b', C_MUT = '#8b98a8', C_GRID = 'rgba(255,255,255,.07)';
var C_MA5 = '#ffd166', C_MA20 = '#59a7ff', C_MA60 = '#c084fc';

function n1(x) { return (Math.round(x * 10) / 10); }
function esc(s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }
function sma(vals, n) {
  var out = [], sum = 0;
  for (var i = 0; i < vals.length; i++) {
    sum += vals[i];
    if (i >= n) sum -= vals[i - n];
    out.push(i >= n - 1 ? sum / n : NaN);
  }
  return out;
}

/* ---------------- K 線圖 ---------------- */
function candles(rows, opts) {
  opts = opts || {};
  rows = (rows || []).slice(-(opts.days || 120));
  if (rows.length < 5) return '<div class="empty">歷史資料不足，無法畫圖</div>';
  var W = opts.width || 360, H = opts.height || 235;
  var volH = opts.showVol === false ? 0 : 34, gap = 6;
  var padL = 4, padR = 44, padT = 10;
  var plotW = W - padL - padR, plotH = H - padT - volH - gap - 16;
  var vols = rows.map(function (r) { return r[5]; });
  var closes = rows.map(function (r) { return r[4]; });
  var ma5 = sma(closes, 5).slice(-rows.length);
  var ma20 = sma(closes, 20).slice(-rows.length);
  var ma60 = sma(closes, 60).slice(-rows.length);
  var ma20full = sma(closes, 20);
  var lo = Infinity, hi = -Infinity;
  rows.forEach(function (r, i) {
    lo = Math.min(lo, r[3]); hi = Math.max(hi, r[2]);
    [ma5, ma20, ma60].forEach(function (m) { if (isFinite(m[i])) { lo = Math.min(lo, m[i]); hi = Math.max(hi, m[i]); } });
  });
  [opts.stop, opts.target].forEach(function (v) { if (isFinite(v) && v > 0) { lo = Math.min(lo, v); hi = Math.max(hi, v); } });
  var pad = (hi - lo) * 0.06 || 1;
  lo -= pad; hi += pad;
  function Y(p) { return padT + (hi - p) / (hi - lo) * plotH; }
  var bw = plotW / rows.length;
  var cw = Math.max(1.2, Math.min(9, bw * 0.62));
  var maxVol = Math.max.apply(null, vols.filter(isFinite)) || 1;

  var s = '<svg viewBox="0 0 ' + W + ' ' + H + '" class="chart" preserveAspectRatio="xMidYMid meet">';
  /* 水平格線 + 價格刻度 */
  for (var g = 0; g <= 3; g++) {
    var p = lo + (hi - lo) * g / 3, y = Y(p);
    s += '<line x1="' + padL + '" y1="' + n1(y) + '" x2="' + (padL + plotW) + '" y2="' + n1(y) + '" stroke="' + C_GRID + '" stroke-width="1"/>';
    s += '<text x="' + (W - 3) + '" y="' + n1(y + 3) + '" class="ct" text-anchor="end">' + p.toFixed(p > 100 ? 0 : 2) + '</text>';
  }
  /* 量能 */
  if (volH) {
    var vy0 = padT + plotH + gap;
    rows.forEach(function (r, i) {
      var h = Math.max(0.6, (isFinite(r[5]) ? r[5] : 0) / maxVol * volH);
      var col = r[4] >= r[1] ? C_UP : C_DN;
      s += '<rect x="' + n1(padL + i * bw + (bw - cw) / 2) + '" y="' + n1(vy0 + volH - h) + '" width="' + n1(cw) + '" height="' + n1(h) + '" fill="' + col + '" opacity=".45" rx="0.6"/>';
    });
    s += '<text x="' + padL + '" y="' + (vy0 - 2) + '" class="ct">成交量</text>';
  }
  /* K 棒 */
  rows.forEach(function (r, i) {
    var x = padL + i * bw + bw / 2;
    var o = r[1], h = r[2], l = r[3], c = r[4];
    var col = c >= o ? C_UP : C_DN;
    s += '<line x1="' + n1(x) + '" y1="' + n1(Y(h)) + '" x2="' + n1(x) + '" y2="' + n1(Y(l)) + '" stroke="' + col + '" stroke-width="1"/>';
    var y1 = Y(Math.max(o, c)), y2 = Y(Math.min(o, c));
    s += '<rect x="' + n1(x - cw / 2) + '" y="' + n1(y1) + '" width="' + n1(cw) + '" height="' + n1(Math.max(1, y2 - y1)) + '" fill="' + col + '" rx="0.6"/>';
  });
  /* 均線 */
  function poly(arr, color, name) {
    var d = '', started = false;
    arr.forEach(function (v, i) {
      if (!isFinite(v)) return;
      d += (started ? 'L' : 'M') + n1(padL + i * bw + bw / 2) + ' ' + n1(Y(v)) + ' ';
      started = true;
    });
    return d ? '<path d="' + d + '" fill="none" stroke="' + color + '" stroke-width="1.3" opacity=".95"/>' : '';
  }
  var maN = opts.ma || [5, 20];
  if (maN.indexOf(5) >= 0) s += poly(ma5, C_MA5);
  if (maN.indexOf(20) >= 0) s += poly(ma20, C_MA20);
  if (maN.indexOf(60) >= 0) s += poly(ma60, C_MA60);
  /* 停損／目標線 */
  function hline(v, color, label) {
    if (!isFinite(v) || v <= 0) return '';
    var y = Y(v);
    return '<line x1="' + padL + '" y1="' + n1(y) + '" x2="' + (padL + plotW) + '" y2="' + n1(y) +
      '" stroke="' + color + '" stroke-width="1.2" stroke-dasharray="5 4"/>' +
      '<text x="' + (padL + 3) + '" y="' + n1(y - 3) + '" class="ct" fill="' + color + '">' + label + ' ' + v.toFixed(v > 100 ? 0 : 2) + '</text>';
  }
  s += hline(opts.stop, C_DN, '停損');
  s += hline(opts.target, C_UP, '目標');
  /* 日期 */
  s += '<text x="' + padL + '" y="' + (H - 3) + '" class="ct">' + esc(rows[0][0].slice(5)) + '</text>';
  s += '<text x="' + (padL + plotW) + '" y="' + (H - 3) + '" class="ct" text-anchor="end">' + esc(rows[rows.length - 1][0].slice(5)) + '</text>';
  /* 除權息／異常大跌標記 */
  var gw = false;
  rows.forEach(function (r, i) {
    if (i > 0 && rows[i - 1][4] > 0 && (r[4] - rows[i - 1][4]) / rows[i - 1][4] < -0.12) {
      gw = true;
      s += '<text x="' + n1(padL + i * bw + bw / 2) + '" y="' + n1(Y(r[3]) + 10) + '" class="ct" text-anchor="middle">⚠</text>';
    }
  });
  s += '</svg>';
  var lg = [];
  if (maN.indexOf(5) >= 0) lg.push('<i style="background:' + C_MA5 + '"></i>5日均線');
  if (maN.indexOf(20) >= 0) lg.push('<i style="background:' + C_MA20 + '"></i>20日均線（月線）');
  if (maN.indexOf(60) >= 0) lg.push('<i style="background:' + C_MA60 + '"></i>60日均線（季線）');
  var out = s + '<div class="lgd">' + lg.map(function (x) { return '<span>' + x + '</span>'; }).join('') +
    '<span><i style="background:' + C_UP + '"></i>上漲</span><span><i style="background:' + C_DN + '"></i>下跌</span></div>';
  if (gw) out += '<div class="note sm">⚠ 那天出現單日大跌超過 12%，很可能是除權息而不是真的崩跌，均線要打折看。</div>';
  out += '<div class="note sm">怎麼看：每一根細長條是一天的價格，<b class="up">紅色</b>代表收盤比開盤高（今天買的人多）、<b class="dn">綠色</b>代表收盤比開盤低。下方面積是當天的成交量，愈高代表當天交易愈熱絡。</div>';
  return out;
}

/* ---------------- 五力雷達（雪花圖） ---------------- */
function radar(axes) {
  var W = 300, H = 236, cx = W / 2, cy = H / 2 + 6, R = 74;
  var list = axes.filter(function (a) { return a.score !== null; });
  var avg = list.length ? list.reduce(function (s, a) { return s + a.score; }, 0) / list.length : 0;
  var col = avg >= 7 ? C_UP : avg >= 5 ? '#f0b429' : C_MUT;
  var s = '<svg viewBox="0 0 ' + W + ' ' + H + '" class="chart">';
  for (var ring = 1; ring <= 4; ring++) {
    var pts = [];
    for (var i = 0; i < axes.length; i++) {
      var ang = -Math.PI / 2 + i * 2 * Math.PI / axes.length, rr = R * ring / 4;
      pts.push(n1(cx + Math.cos(ang) * rr) + ',' + n1(cy + Math.sin(ang) * rr));
    }
    s += '<polygon points="' + pts.join(' ') + '" fill="none" stroke="' + C_GRID + '"/>';
  }
  var poly = [];
  for (var j = 0; j < axes.length; j++) {
    var a2 = -Math.PI / 2 + j * 2 * Math.PI / axes.length;
    s += '<line x1="' + n1(cx) + '" y1="' + n1(cy) + '" x2="' + n1(cx + Math.cos(a2) * R) + '" y2="' + n1(cy + Math.sin(a2) * R) + '" stroke="' + C_GRID + '"/>';
    var sc = axes[j].score === null ? 0 : axes[j].score;
    poly.push(n1(cx + Math.cos(a2) * R * sc / 10) + ',' + n1(cy + Math.sin(a2) * R * sc / 10));
    var lx = cx + Math.cos(a2) * (R + 26), ly = cy + Math.sin(a2) * (R + 20);
    s += '<text x="' + n1(lx) + '" y="' + n1(ly) + '" class="ct" text-anchor="middle" font-size="11" fill="' +
      (axes[j].score === null ? C_MUT : '#e6edf5') + '">' + esc(axes[j].label) + '</text>';
    s += '<text x="' + n1(lx) + '" y="' + n1(ly + 12) + '" class="ct" text-anchor="middle" font-size="11" fill="' + col + '">' +
      (axes[j].score === null ? '—' : axes[j].score) + '</text>';
  }
  s += '<polygon points="' + poly.join(' ') + '" fill="' + col + '" fill-opacity=".22" stroke="' + col + '" stroke-width="1.8"/>';
  s += '</svg>';
  return s;
}

/* ---------------- 技術評分儀表 ---------------- */
function gauge(score) {
  var W = 300, H = 150, cx = 150, cy = 128, R = 104;
  var zones = [
    { to: 45, c: '#4a5566', t: '偏弱' }, { to: 60, c: '#59a7ff', t: '中性' },
    { to: 72, c: '#f0b429', t: '觀察' }, { to: 100, c: '#ff5b5b', t: '佈局' }
  ];
  function arc(a1, a2, r) {
    var x1 = cx + Math.cos(Math.PI + a1 * Math.PI) * r, y1 = cy + Math.sin(Math.PI + a1 * Math.PI) * r;
    var x2 = cx + Math.cos(Math.PI + a2 * Math.PI) * r, y2 = cy + Math.sin(Math.PI + a2 * Math.PI) * r;
    return 'M' + n1(x1) + ' ' + n1(y1) + ' A' + r + ' ' + r + ' 0 0 1 ' + n1(x2) + ' ' + n1(y2);
  }
  var s = '<svg viewBox="0 0 ' + W + ' ' + H + '" class="chart">';
  var from = 0;
  zones.forEach(function (z) {
    s += '<path d="' + arc(from / 100, z.to / 100, R) + '" fill="none" stroke="' + z.c + '" stroke-width="13" stroke-linecap="butt" opacity=".85"/>';
    var mid = (from + z.to) / 200;
    var tx = cx + Math.cos(Math.PI + mid * Math.PI) * (R - 24), ty = cy + Math.sin(Math.PI + mid * Math.PI) * (R - 24);
    s += '<text x="' + n1(tx) + '" y="' + n1(ty) + '" class="ct" text-anchor="middle" font-size="9">' + z.t + '</text>';
    from = z.to;
  });
  var f = Math.max(0, Math.min(100, score)) / 100;
  var nx = cx + Math.cos(Math.PI + f * Math.PI) * (R - 6), ny = cy + Math.sin(Math.PI + f * Math.PI) * (R - 6);
  s += '<line x1="' + cx + '" y1="' + cy + '" x2="' + n1(nx) + '" y2="' + n1(ny) + '" stroke="#e6edf5" stroke-width="2.4" stroke-linecap="round"/>';
  s += '<circle cx="' + cx + '" cy="' + cy + '" r="5" fill="#e6edf5"/>';
  s += '<text x="' + cx + '" y="' + (cy - 26) + '" text-anchor="middle" font-size="30" font-weight="700" fill="#e6edf5">' + Math.round(score) + '</text>';
  s += '<text x="' + cx + '" y="' + (cy - 8) + '" text-anchor="middle" font-size="10.5" fill="' + C_MUT + '">綜合評分（0–100）</text>';
  s += '</svg>';
  return s;
}

/* ---------------- 走勢線（迷你） ---------------- */
function spark(vals, opts) {
  opts = opts || {};
  var W = opts.width || 100, H = opts.height || 30;
  vals = (vals || []).filter(isFinite);
  if (vals.length < 2) return '';
  var lo = Math.min.apply(null, vals), hi = Math.max.apply(null, vals);
  if (hi === lo) { hi += .5; lo -= .5; }
  var d = '';
  vals.forEach(function (v, i) {
    d += (i ? 'L' : 'M') + n1(i / (vals.length - 1) * W) + ' ' + n1(H - (v - lo) / (hi - lo) * H);
  });
  var col = opts.color || (vals[vals.length - 1] >= vals[0] ? C_UP : C_DN);
  return '<svg viewBox="0 0 ' + W + ' ' + H + '" class="spark" preserveAspectRatio="none"><path d="' + d +
    '" fill="none" stroke="' + col + '" stroke-width="1.6"/>' +
    (opts.fill ? '<path d="' + d + 'L' + W + ' ' + H + 'L0 ' + H + 'Z" fill="' + col + '" opacity=".12"/>' : '') + '</svg>';
}

/* ---------------- 月營收柱狀圖 ---------------- */
function bars(history) {
  var W = 330, H = 96, pad = 16;
  var vals = history.map(function (h) { return h.rev; });
  var mx = Math.max.apply(null, vals) || 1;
  var n = vals.length, bw = (W - pad * 2) / n;
  var s = '<svg viewBox="0 0 ' + W + ' ' + H + '" class="chart">';
  var prevY = null;
  history.forEach(function (h, i) {
    var yoyRef = i >= 12 ? history[i - 12].rev : null;
    var col = yoyRef ? (h.rev >= yoyRef ? C_UP : C_DN) : '#4a5566';
    var bh = h.rev / mx * (H - 34);
    var x = pad + i * bw;
    s += '<rect x="' + n1(x + bw * 0.15) + '" y="' + n1(H - 18 - bh) + '" width="' + n1(bw * 0.7) + '" height="' + n1(bh) + '" fill="' + col + '" opacity=".8" rx="1.5"/>';
    if (i % 3 === 0 || i === n - 1) s += '<text x="' + n1(x + bw / 2) + '" y="' + (H - 5) + '" class="ct" text-anchor="middle" font-size="8.5">' + h.m + '月</text>';
  });
  s += '</svg><div class="lgd"><span><i style="background:' + C_UP + '"></i>比去年同期好</span><span><i style="background:' + C_DN + '"></i>比去年同期差</span></div>';
  return s;
}

/* ---------------- 類股熱力圖 ---------------- */
function heat(tiles) {
  var s = '<div class="heat">';
  tiles.forEach(function (t) {
    var p = t.avgPct;
    var bg = p >= 2 ? 'rgba(255,91,91,.55)' : p >= 0.5 ? 'rgba(255,91,91,.28)' : p > -0.5 ? 'rgba(255,255,255,.06)' :
             p > -2 ? 'rgba(34,197,139,.24)' : 'rgba(34,197,139,.5)';
    s += '<div class="tile" style="background:' + bg + '" data-act="heat" data-ind="' + esc(t.ind) + '">' +
      '<b>' + esc(shortInd(t.ind)) + '</b><span class="' + (p >= 0 ? 'up' : 'dn') + '">' + (p >= 0 ? '+' : '') + n1(p) + '%</span>' +
      '<em>' + t.n + ' 檔</em></div>';
  });
  s += '</div>';
  return s;
}
function shortInd(x) {
  return String(x || '').replace('業', '').replace('工業', '').replace('電子零組件', '電子零件')
    .replace('電腦及週邊設備', '電腦週邊').replace('金融保險', '金融').replace('其他', '其他');
}

/* ---------------- 相對強度（RS）線 ---------------- */
function rsline(points) {
  if (!points || points.length < 5) return '';
  var W = 330, H = 70, pad = 6;
  var vals = points.map(function (p) { return p[1]; });
  var lo = Math.min.apply(null, vals), hi = Math.max.apply(null, vals);
  if (hi === lo) { hi += .5; lo -= .5; }
  var d = '';
  points.forEach(function (p, i) {
    d += (i ? 'L' : 'M') + n1(pad + i / (points.length - 1) * (W - pad * 2)) + ' ' + n1(H - 12 - (p[1] - lo) / (hi - lo) * (H - 22));
  });
  var last = vals[vals.length - 1], first = vals[0];
  var col = last >= first ? C_UP : C_DN;
  var y100 = H - 12 - (100 - lo) / (hi - lo) * (H - 22);
  var s = '<svg viewBox="0 0 ' + W + ' ' + H + '" class="chart">';
  if (y100 > 6 && y100 < H - 4) s += '<line x1="' + pad + '" y1="' + n1(y100) + '" x2="' + (W - pad) + '" y2="' + n1(y100) + '" stroke="' + C_GRID + '" stroke-dasharray="4 4"/>';
  s += '<path d="' + d + '" fill="none" stroke="' + col + '" stroke-width="1.8"/>';
  s += '<text x="' + pad + '" y="10" class="ct" font-size="9">相對大盤強度（100＝與大盤同步）</text>';
  s += '</svg>';
  return s;
}

  if (ap) out.push('台積電 ADR 換算回台股約 ' + T.fmtPx(ap.implied) + ' 元，比台股收盤 ' + T.fmtPx(ap.tw) + ' ' +
    (ap.premiumPct >= 0 ? '溢價 ' + T.fmt(ap.premiumPct, 1) + '%，隔天台積電偏多看待。' : '折價 ' + T.fmt(Math.abs(ap.premiumPct), 1) + '%，隔天可能開低。'));
  if (S.holdings.length) {
    var warns = 0;
    S.holdings.forEach(function (hd) {
      var a = analysisFor(hd.code);
      if (a) { var sg = ST.holdingSignal(hd, a, S.cfg); if (sg.cls === 'cut' || sg.cls === 'warnp') warns++; }
    });
    if (warns) out.push('你的持股有 <b>' + warns + '</b> 檔今天出現提醒訊號，記得到「持股」頁看一下。');

  } else {
    out.push('還沒有記錄持股。可以先用「模擬」功能練功，等有把握再投入真錢。');
  }
  return out.map(function (t) { return '<li>' + t + '</li>'; }).join('');
}

function viewHold() {

  if (!S.holdings.length) {
    h += '<div class="card"><div class="empty">還沒有持股紀錄。<br>按右上「＋ 新增」輸入你實際買進的成本與股數，系統就會每天幫你盯著停損。</div></div>';
    return h;

  var totalCost = 0, totalVal = 0;
  S.holdings.forEach(function (hd) {

      '<div class="mut2 tiny">未實現 ' + T.fmtMoney(totalVal - totalCost) + '</div></div></div></div>';
  }
  S.holdings.forEach(function (hd) {

    h += '<div class="card" data-act="detail" data-code="' + hd.code + '">' +
      '<div class="row"><div class="avatar">' + iconOf(hd.code) + '</div>' +

    if (sg) {
      h += '<div class="hr"></div><div class="row wrap">' + pill(sg.v, sg.cls) +
        (sg.plan ? pill('停損 ' + T.fmtPx(sg.stop), 'warnp') : '') +
